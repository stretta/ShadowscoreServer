<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowScore Matrix Edit</title>
    <link rel="stylesheet" href="/shared/shadowscore-style.css" />
    <script type="module" crossorigin src="/matrix-edit/assets/index-u38B1jwf.js"></script>
    <link rel="stylesheet" crossorigin href="/matrix-edit/assets/index-Hj3A_M_K.css">
  </head>
  <body>
    <nav class="ss-route-tabs" aria-label="ShadowScore routes">
      <a href="/">Dashboard</a>
      <a href="/structure-editor">Structure</a>
      <a href="/matrix-edit" aria-current="page">Matrix</a>
      <a href="/event-list">Event List</a>
      <a href="/admin">Admin</a>
      <a href="/transport/status">Transport</a>
    </nav>
    <main>
      <div class="toolbar performance-toolbar">
        <label class="check-label">
          <input id="chase" type="checkbox" />
          Chase
        </label>
        <select id="block" aria-label="Editing section"></select>
        <span class="voice-combobox">
          <select id="voice" class="native-voice-select" aria-label="ShadowScore player" tabindex="-1"></select>
          <button
            id="voice-menu-button"
            class="voice-menu-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="voice-menu-options"
          >
            <span id="voice-color-swatch" class="voice-color-swatch" aria-hidden="true"></span>
            <span id="voice-menu-label" class="voice-menu-label">No player</span>
            <span class="voice-menu-chevron" aria-hidden="true"></span>
          </button>
          <span id="voice-menu-options" class="voice-menu-options" role="listbox" hidden></span>
        </span>
        <select id="clip" aria-label="ShadowScore clip"></select>
        <button id="create-clip" type="button">Create Clip</button>
        <span id="routing-status" class="routing-status" aria-live="polite">Unassigned</span>
        <button id="start-transport" type="button">Play</button>
        <button id="stop-transport" type="button">Stop</button>
        <button id="return-start" type="button">Return to A</button>
        <span id="stage-status" class="stage-status"></span>
        <details class="advanced-panel">
          <summary>Advanced</summary>
          <div class="advanced-popover">
            <div class="toolbar">
              <select id="mode" aria-label="Editor mode">
                <option value="shadowscore" selected>ShadowScore Server</option>
                <option value="rnbo">RNBO Packed Notes</option>
              </select>
              <select id="server-select" aria-label="ShadowScore servers"></select>
              <button id="discover" type="button">Scan</button>
              <input id="server" value="" aria-label="ShadowScore server" placeholder="Custom server" />
              <select id="rnbo-target" aria-label="Live client"></select>
              <input id="assignee" value="" aria-label="ShadowScore assignee" placeholder="Assignee" />
              <input id="device-id" value="" aria-label="ShadowScore device" placeholder="Device" />
              <input id="client-id" value="" aria-label="ShadowScore client" placeholder="Client" />
              <input id="assignment-label" value="" aria-label="ShadowScore assignment label" placeholder="Label" />
              <input id="assignment-color" value="" aria-label="ShadowScore assignment color" placeholder="Color" />
              <label class="check-label">
                <input id="assignment-locked" type="checkbox" />
                Locked
              </label>
              <button id="assign" type="button">Assign</button>
              <button id="clear" class="danger-button" type="button">Clear Voice</button>
              <input id="target" value="http://192.168.68.96:5678" aria-label="RNBO target" />
              <input id="bridge" value="http://127.0.0.1:8790" aria-label="RNBO OSC bridge" />
              <button id="refresh" type="button">Refresh</button>
              <button id="sync" type="button">Sync</button>
            </div>
          </div>
        </details>
      </div>
      <div id="projection-header" class="projection-header" aria-live="polite">
        <div>
          <span>Playing</span>
          <strong id="playing-block">Stopped</strong>
        </div>
        <div>
          <span>Editing</span>
          <strong id="editing-block">No section</strong>
        </div>
        <div>
          <span>Player</span>
          <strong id="editing-player">No player</strong>
        </div>
        <div>
          <span>Clip</span>
          <strong id="editing-clip">No clip</strong>
        </div>
        <div>
          <span>Playback</span>
          <strong id="projection-playback">Refresh required</strong>
        </div>
      </div>
      <div class="toolbar compact">
        <label>
          Root
          <select id="scale-root"></select>
        </label>
        <label>
          Scale
          <select id="scale"></select>
        </label>
        <label>
          Low Note
          <span class="stepper">
            <input id="root-pitch" type="number" min="0" max="127" value="48" />
            <span class="stepper-buttons">
              <button type="button" class="stepper-button" data-step-target="root-pitch" data-step-amount="1" aria-label="Increase low note">+</button>
              <button type="button" class="stepper-button" data-step-target="root-pitch" data-step-amount="-1" aria-label="Decrease low note">-</button>
            </span>
          </span>
        </label>
        <label>
          Rows
          <span class="stepper">
            <input id="pitch-rows" type="number" min="8" max="64" value="24" />
            <span class="stepper-buttons">
              <button type="button" class="stepper-button" data-step-target="pitch-rows" data-step-amount="1" aria-label="Increase rows">+</button>
              <button type="button" class="stepper-button" data-step-target="pitch-rows" data-step-amount="-1" aria-label="Decrease rows">-</button>
            </span>
          </span>
        </label>
        <label>
          Resolution
          <span class="stepper">
            <input id="grid-subdivision" type="number" min="1" max="256" value="16" />
            <span class="stepper-buttons">
              <button type="button" class="stepper-button" data-step-target="grid-subdivision" data-step-amount="1" aria-label="Increase resolution">+</button>
              <button type="button" class="stepper-button" data-step-target="grid-subdivision" data-step-amount="-1" aria-label="Decrease resolution">-</button>
            </span>
          </span>
        </label>
        <label>
          Duration
          <span class="stepper">
            <input id="duration" type="number" min="0.000001" max="255" step="any" value="0.25" />
            <span class="stepper-buttons">
              <button type="button" class="stepper-button" data-step-target="duration" data-step-amount="1" aria-label="Increase duration">+</button>
              <button type="button" class="stepper-button" data-step-target="duration" data-step-amount="-1" aria-label="Decrease duration">-</button>
            </span>
          </span>
        </label>
        <label>
          Velocity
          <span class="stepper">
            <input id="velocity" type="number" min="1" max="127" value="100" />
            <span class="stepper-buttons">
              <button type="button" class="stepper-button" data-step-target="velocity" data-step-amount="1" aria-label="Increase velocity">+</button>
              <button type="button" class="stepper-button" data-step-target="velocity" data-step-amount="-1" aria-label="Decrease velocity">-</button>
            </span>
          </span>
        </label>
        <div class="edit-tools" aria-label="Focused player editing tools">
          <button type="button" class="icon-button" data-edit-shift="left" aria-label="Shift focused player left" title="Shift focused player left">&larr;</button>
          <button type="button" class="icon-button" data-edit-shift="right" aria-label="Shift focused player right" title="Shift focused player right">&rarr;</button>
          <button type="button" class="icon-button" data-edit-shift="up" aria-label="Shift focused player up" title="Shift focused player up">&uarr;</button>
          <button type="button" class="icon-button" data-edit-shift="down" aria-label="Shift focused player down" title="Shift focused player down">&darr;</button>
          <button id="edit-random" type="button">Random Events</button>
          <button id="edit-vary" type="button">Vary Events</button>
        </div>
      </div>
      <canvas id="matrix" aria-label="RNBO matrix parameter"></canvas>
      <p id="status"></p>
    </main>
  </body>
</html>
