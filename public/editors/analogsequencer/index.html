<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnalogSequencer Editor</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <style>
    body { margin: 0; min-height: 100vh; }
    main { display: grid; gap: 12px; margin: 0 auto; padding: 16px 0 32px; width: min(1440px, calc(100vw - 28px)); }
    .top { align-items: center; display: flex; gap: 14px; justify-content: space-between; }
    h1 { font-size: 18px; line-height: 1.1; margin: 0; }
    .subtitle, .status, .detail, .empty { color: var(--ss-muted); font-size: 12px; font-weight: 750; }
    .subtitle { margin: 4px 0 0; }
    .status { max-width: 48vw; overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar, .targets, .sequencer { background: var(--ss-panel); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-ui); }
    .toolbar { align-items: center; display: flex; gap: 10px; justify-content: space-between; padding: 10px; }
    .toolbar-actions { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; }
    .targets { display: flex; gap: 8px; overflow-x: auto; padding: 10px; }
    .target { align-items: start; background: var(--ss-surface); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-control); cursor: pointer; display: grid; flex: 0 0 210px; gap: 3px 8px; grid-template-columns: auto 1fr; padding: 8px; }
    .target.focused { border-color: var(--ss-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ss-accent) 28%, transparent); }
    .target input { grid-row: 1 / span 2; margin-top: 2px; }
    .target strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sequencer { min-width: 0; overflow-x: auto; padding: 14px; }
    .stages { display: grid; gap: 7px; grid-template-columns: repeat(16, minmax(58px, 1fr)); min-width: 1030px; }
    .stage { align-items: center; background: var(--ss-surface); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-control); display: grid; gap: 7px; grid-template-rows: auto auto 190px auto auto; justify-items: center; padding: 8px 5px; }
    .stage.playing { border-color: var(--ss-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ss-accent) 42%, transparent), inset 0 0 22px color-mix(in srgb, var(--ss-accent) 13%, transparent); }
    .stage.playing .stage-number { color: var(--ss-accent); }
    .stage.unused { opacity: .32; }
    .stage-number { color: var(--ss-muted); font-size: 10px; font-weight: 850; letter-spacing: .08em; }
    .note { color: var(--ss-accent); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 900; min-height: 16px; }
    .value { color: var(--ss-text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 850; }
    .slider { accent-color: var(--ss-accent-secondary); appearance: auto; direction: rtl; height: 190px; margin: 0; width: 25px; writing-mode: vertical-lr; }
    .step { align-items: center; cursor: pointer; display: flex; justify-content: center; }
    .step input { appearance: none; background: var(--ss-bg); border: 2px solid var(--ss-border-strong); border-radius: 4px; height: 25px; margin: 0; width: 25px; }
    .step input:checked { background: var(--ss-accent); border-color: var(--ss-accent); box-shadow: inset 0 0 0 5px var(--ss-surface); }
    .step input:focus-visible { outline: 2px solid var(--ss-accent-secondary); outline-offset: 2px; }
    .missing { opacity: .45; }
    .parameters { background: var(--ss-panel); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-ui); display: grid; gap: 12px; padding: 14px; }
    .parameters h2 { font-size: 14px; margin: 0; }
    .parameter-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .parameter { background: var(--ss-surface); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-control); display: grid; gap: 7px; padding: 10px; }
    .parameter-head { align-items: baseline; display: flex; gap: 8px; justify-content: space-between; }
    .parameter-name { font-size: 12px; font-weight: 850; overflow-wrap: anywhere; }
    .parameter-value { color: var(--ss-accent); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 850; }
    .parameter input, .parameter select { min-width: 0; width: 100%; }
    .parameter-toggle { align-items: center; cursor: pointer; display: flex; gap: 9px; width: max-content; }
    .parameter-toggle input { height: 22px; margin: 0; width: 22px; }
    @media (max-width: 700px) { .top, .toolbar { align-items: flex-start; flex-direction: column; } .status { max-width: none; text-align: left; white-space: normal; } }
  </style>
</head>
<body>
  <header class="ss-top-strip"><div class="top"><div><h1>AnalogSequencer Editor</h1><p class="subtitle">16-stage pitch and step controls</p></div><div id="status" class="status" role="status">Loading targets...</div></div></header>
  <nav class="ss-route-tabs" aria-label="ShadowScore routes"><a href="/">Dashboard</a><a href="/structure-editor">Structure</a><a href="/matrix-edit">Matrix</a><a href="/piano-roll">Piano Roll</a><a href="/event-list">Event List</a><a href="/editors" aria-current="page">OSC Generators</a><a href="/admin">Admin</a></nav>
  <main>
    <section class="toolbar"><strong>Available clients · choose one to edit</strong><div class="toolbar-actions"><button id="clock-all-off" type="button">Clock All Off</button><button id="rtz-all" class="primary" type="button">RTZ All Clients</button><button id="clock-all-on" type="button">Clock All On</button><button id="rtz" type="button">RTZ Focused</button><button id="refresh" type="button">Refresh</button></div></section>
    <section id="targets" class="targets" aria-live="polite"></section>
    <section class="sequencer"><div id="stages" class="stages"></div></section>
    <section class="parameters"><h2>Sequence Parameters</h2><div id="parameters" class="parameter-grid"></div></section>
  </main>
  <script>
    const targetsEl = document.querySelector("#targets");
    const stagesEl = document.querySelector("#stages");
    const parametersEl = document.querySelector("#parameters");
    const statusEl = document.querySelector("#status");
    const pending = new Map();
    let targets = [];
    let focusedTargetId = "";
    let stagePollTimer;
    let stagePollGeneration = 0;

    document.querySelector("#refresh").addEventListener("click", () => refresh().catch(reportError));
    document.querySelector("#rtz").addEventListener("click", () => returnToZero().catch(reportError));
    document.querySelector("#rtz-all").addEventListener("click", () => returnAllToZero().catch(reportError));
    document.querySelector("#clock-all-off").addEventListener("click", () => setAllClocks(0).catch(reportError));
    document.querySelector("#clock-all-on").addEventListener("click", () => setAllClocks(1).catch(reportError));
    refresh().catch(reportError);

    async function refresh() {
      statusEl.textContent = "Loading AnalogSequencer targets...";
      const response = await fetch("/osc/targets?app=analogsequencer&status=online", { cache: "no-store" });
      if (!response.ok) throw new Error(`Target discovery failed (${response.status})`);
      targets = (await response.json()).targets || [];
      if (!targets.some(target => target.id === focusedTargetId)) focusedTargetId = targets[0]?.id || "";
      renderTargets();
      if (focusedTargetId) await hydrateFocusedTarget();
      else { renderStages(); renderParameters(); }
      statusEl.textContent = targets.length ? `${targets.length} client${targets.length === 1 ? "" : "s"} online · editing ${focusedTarget()?.label || focusedTargetId}` : "No AnalogSequencer client online";
      startStagePolling();
    }

    function renderTargets() {
      targetsEl.innerHTML = targets.length ? targets.map(target => `<label class="target${target.id === focusedTargetId ? " focused" : ""}"><input type="radio" name="focused-target" data-target="${escapeHtml(target.id)}" ${target.id === focusedTargetId ? "checked" : ""}><strong>${escapeHtml(target.label || target.id)}</strong><span class="detail">${escapeHtml(target.deviceId || target.unitId || target.host || "")}</span></label>`).join("") : `<span class="empty">No live client found. The editor will populate when AnalogSequencer is instantiated and discovered.</span>`;
      for (const input of targetsEl.querySelectorAll("[data-target]")) input.addEventListener("change", () => focusTarget(input.dataset.target).catch(reportError));
    }

    function renderStages() {
      const source = focusedTarget() || { parameters: [] };
      const values = indexedParams(source.parameters, /^(?:(\d+)StageValue|StageValue[_ -]?(\d+))$/i);
      const steps = indexedParams(source.parameters, /^(?:(\d+)StageStep|StageStep[_ -]?(\d+))$/i);
      stagesEl.replaceChildren(...Array.from({ length: 16 }, (_, offset) => createStage(offset + 1, values.get(offset + 1), steps.get(offset + 1))));
      applyMaxCount(maxCountValue(source));
    }

    function renderParameters() {
      const source = focusedTarget() || { parameters: [] };
      const params = (source.parameters || []).filter(param => !/Stage(?:Value|Step)/i.test(param.name));
      parametersEl.replaceChildren(...params.map(createParameterControl));
      if (!params.length) parametersEl.innerHTML = `<span class="empty">No additional parameters reported.</span>`;
    }

    function createParameterControl(param) {
      const card = document.createElement("label"); card.className = "parameter";
      const head = document.createElement("span"); head.className = "parameter-head";
      const name = document.createElement("span"); name.className = "parameter-name"; name.textContent = isMaxCountParam(param) ? "Max Count" : (param.displayName || param.name);
      const readout = document.createElement("output"); readout.className = "parameter-value"; readout.textContent = formatParameterValue(param.value);
      head.append(name, readout); card.append(head);
      if (Array.isArray(param.values) && param.values.length) {
        const select = document.createElement("select");
        for (const value of uniqueParameterValues(param.values)) { const option = document.createElement("option"); option.value = value; option.textContent = value; select.append(option); }
        select.value = String(param.value); select.addEventListener("change", () => { param.value = select.value; readout.textContent = select.value; if (isMaxCountParam(param)) applyMaxCount(maxCountParamValue(param)); sendParam(param.name, select.value).catch(reportError); }); card.append(select);
      } else if (isToggleParam(param)) {
        const toggleLabel = document.createElement("span"); toggleLabel.className = "parameter-toggle";
        const toggle = document.createElement("input"); toggle.type = "checkbox"; toggle.checked = Boolean(Number(param.value)); toggle.setAttribute("aria-label", param.displayName || param.name);
        const state = document.createElement("span"); state.textContent = toggle.checked ? "On" : "Off";
        toggle.addEventListener("change", () => { const value = toggle.checked ? 1 : 0; param.value = value; state.textContent = toggle.checked ? "On" : "Off"; readout.textContent = String(value); sendParam(param.name, value).catch(reportError); });
        toggleLabel.append(toggle, state); card.append(toggleLabel);
      } else {
        const min = Number(param.min ?? 0); const max = Number(param.max ?? 1); const curved = shouldCurve(param, min, max);
        const input = document.createElement("input"); input.type = "range"; input.min = curved ? "0" : String(min); input.max = curved ? "1" : String(max); input.step = curved ? "0.001" : String(parameterStep(param)); input.value = String(curved ? valueToSliderPosition(param, param.value, min, max) : (param.value ?? min));
        input.addEventListener("input", () => { const value = sliderValue(param, input, min, max, curved); param.value = value; readout.textContent = formatParameterValue(value); if (isMaxCountParam(param)) applyMaxCount(Math.round(value)); scheduleSend(param.name, value); });
        input.addEventListener("change", () => flushSend(param.name, sliderValue(param, input, min, max, curved))); card.append(input);
      }
      return card;
    }

    function createStage(number, valueParam, stepParam) {
      const stage = document.createElement("div");
      stage.className = `stage${valueParam || stepParam ? "" : " missing"}`;
      stage.dataset.stage = String(number);
      const value = integerValue(valueParam?.value, integerValue(valueParam?.min, 0));
      const min = integerValue(valueParam?.min, 0);
      const max = integerValue(valueParam?.max, 127);
      stage.innerHTML = `<span class="stage-number">STEP ${number}</span><span class="note">${midiNote(value)}</span>`;
      const slider = document.createElement("input");
      slider.className = "slider"; slider.type = "range"; slider.min = String(min); slider.max = String(max); slider.step = "1"; slider.value = String(clamp(value, min, max)); slider.disabled = !valueParam;
      const readout = document.createElement("span"); readout.className = "value"; readout.textContent = String(value);
      const note = stage.querySelector(".note");
      slider.addEventListener("input", () => { const next = integerValue(slider.value, value); readout.textContent = String(next); note.textContent = midiNote(next); scheduleSend(valueParam.name, next); });
      slider.addEventListener("change", () => flushSend(valueParam?.name, integerValue(slider.value, value)));
      const toggleLabel = document.createElement("label"); toggleLabel.className = "step"; toggleLabel.title = `Enable step ${number}`;
      const toggle = document.createElement("input"); toggle.type = "checkbox"; toggle.checked = Boolean(Number(stepParam?.value)); toggle.disabled = !stepParam; toggle.setAttribute("aria-label", `Step ${number}`);
      toggle.addEventListener("change", () => sendParam(stepParam.name, toggle.checked ? 1 : 0).catch(reportError));
      toggleLabel.append(toggle); stage.append(slider, readout, toggleLabel); return stage;
    }

    function indexedParams(parameters, pattern) { const result = new Map(); for (const param of parameters || []) { const match = String(param.name || "").match(pattern); if (match) result.set(Number(match[1] || match[2]), param); } return result; }
    function scheduleSend(param, value) { const targetId = focusedTargetId; if (!param || !targetId) return; const key = `${targetId}:${param}`; if (pending.has(key)) clearTimeout(pending.get(key)); pending.set(key, setTimeout(() => { pending.delete(key); sendParam(param, value, targetId).catch(reportError); }, 75)); }
    function flushSend(param, value) { const targetId = focusedTargetId; if (!param || !targetId) return; const key = `${targetId}:${param}`; if (pending.has(key)) { clearTimeout(pending.get(key)); pending.delete(key); } sendParam(param, value, targetId).catch(reportError); }
    async function sendParam(param, value, targetId = focusedTargetId) { const target = targets.find(entry => entry.id === targetId); if (!target) { statusEl.textContent = "No client in focus"; return; } const response = await fetch("/osc/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ targets: [target.id], param, args: [value] }) }); const body = await response.json().catch(() => ({})); const sent = (body.results || []).filter(result => result.ok).length; statusEl.textContent = response.ok && body.ok !== false ? `Sent ${param} = ${value} to ${target.label || target.id}` : `Failed ${param} (${sent}/1)`; }
    async function returnToZero() { const target = focusedTarget(); if (!target) { statusEl.textContent = "No client in focus"; return; } const port = (target.inputPorts || []).find(entry => String(entry.name).toLowerCase() === "rtz"); const address = port?.address || `${target.baseAddress}/messages/in/rtz`; const response = await fetch("/osc/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ targets: [target.id], address, args: [1] }) }); const body = await response.json().catch(() => ({ ok: false })); statusEl.textContent = response.ok && body.ok !== false ? `Return to Zero queued on ${target.label || target.id}` : `Return to Zero failed on ${target.label || target.id}`; }
    async function returnAllToZero() { if (!targets.length) { statusEl.textContent = "No AnalogSequencer clients online"; return; } const targetIds = targets.map(target => target.id); const response = await fetch("/osc/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ targets: targetIds, inputPort: "rtz", args: [1] }) }); const body = await response.json().catch(() => ({ ok: false, results: [] })); const sent = (body.results || []).filter(result => result.ok).length; statusEl.textContent = response.ok && body.ok !== false ? `RTZ queued on all ${sent} clients` : `RTZ queued on ${sent}/${targetIds.length} clients`; }
    async function setAllClocks(value) { if (!targets.length) { statusEl.textContent = "No AnalogSequencer clients online"; return; } const targetIds = targets.map(target => target.id); const response = await fetch("/osc/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ targets: targetIds, param: "Clock", args: [value] }) }); const body = await response.json().catch(() => ({ ok: false, results: [] })); const successfulIds = new Set((body.results || []).filter(result => result.ok).map(result => result.targetId)); for (const target of targets) { if (!successfulIds.has(target.id)) continue; const clock = (target.parameters || []).find(param => param.name === "Clock"); if (clock) clock.value = value; } renderParameters(); const sent = successfulIds.size; const state = value ? "on" : "off"; statusEl.textContent = response.ok && body.ok !== false ? `Clock ${state} on all ${sent} clients` : `Clock ${state} on ${sent}/${targetIds.length} clients`; }
    function startStagePolling() { clearTimeout(stagePollTimer); const generation = ++stagePollGeneration; if (!focusedTarget()) { setPlayingStage(); return; } pollCurrentStage(generation); }
    async function pollCurrentStage(generation) { const targetId = focusedTargetId; try { const target = targets.find(entry => entry.id === targetId); if (!target) throw new Error("No client in focus"); const host = oscQueryHost(target); const path = `${target.baseAddress}/messages/out/current_stage`; const response = await fetch(`${location.protocol}//${host}:5678${path}`, { cache: "no-store" }); if (!response.ok) throw new Error(`current_stage ${response.status}`); const body = await response.json(); if (!isCurrentStagePoll(generation, targetId)) return; setPlayingStage(integerValue(Array.isArray(body.VALUE) ? body.VALUE[0] : body.VALUE, 0)); } catch { if (isCurrentStagePoll(generation, targetId)) setPlayingStage(); } finally { if (isCurrentStagePoll(generation, targetId)) stagePollTimer = setTimeout(() => pollCurrentStage(generation), 125); } }
    function isCurrentStagePoll(generation, targetId) { return generation === stagePollGeneration && targetId === focusedTargetId; }
    async function focusTarget(targetId) { if (!targets.some(target => target.id === targetId) || targetId === focusedTargetId) return; focusedTargetId = targetId; renderTargets(); statusEl.textContent = `Reading ${focusedTarget()?.label || targetId} from OSCQuery...`; await hydrateFocusedTarget(); statusEl.textContent = `${targets.length} client${targets.length === 1 ? "" : "s"} online · editing ${focusedTarget()?.label || targetId}`; startStagePolling(); }
    async function hydrateFocusedTarget() { const target = focusedTarget(); if (!target) return; const response = await fetch(`${location.protocol}//${oscQueryHost(target)}:5678${target.baseAddress}/params`, { cache: "no-store" }); if (!response.ok) throw new Error(`OSCQuery parameter read failed (${response.status})`); const body = await response.json(); const nodes = body.CONTENTS || {};
      target.parameters = (target.parameters || []).map(param => { const node = nodes[param.name]; if (!node) return param; const range = Array.isArray(node.RANGE) ? node.RANGE : []; return { ...param, value: node.VALUE, min: firstDefined(range.map(entry => entry.MIN), param.min), max: firstDefined(range.map(entry => entry.MAX), param.max), values: firstDefined(range.map(entry => entry.VALS), param.values), normalized: node.CONTENTS?.normalized?.VALUE ?? param.normalized }; });
      renderStages(); renderParameters();
    }
    function focusedTarget() { return targets.find(target => target.id === focusedTargetId); }
    function oscQueryHost(target) { return isLoopback(target.host) ? location.hostname : target.host; }
    function firstDefined(values, fallback) { return values.find(value => value !== undefined && value !== null) ?? fallback; }
    function setPlayingStage(number) { for (const stage of stagesEl.querySelectorAll(".stage")) { const playing = Number(stage.dataset.stage) === number; stage.classList.toggle("playing", playing); if (playing) stage.setAttribute("aria-current", "step"); else stage.removeAttribute("aria-current"); } }
    function applyMaxCount(maxCount) { for (const stage of stagesEl.querySelectorAll(".stage")) { const unused = Number(stage.dataset.stage) > maxCount; stage.classList.toggle("unused", unused); for (const input of stage.querySelectorAll("input")) input.disabled = unused || stage.classList.contains("missing"); } }
    function maxCountValue(target) { return maxCountParamValue((target.parameters || []).find(isMaxCountParam)); }
    function maxCountParamValue(param) { return clamp(integerValue(param?.value, 16), 1, 16); }
    function isMaxCountParam(param) { return /^(?:maxcount|maxcnt)$/i.test(String(param?.name || "")); }
    function uniqueParameterValues(values) { return [...new Set((values || []).map(value => String(value)))]; }
    function isToggleParam(param) { return String(param.name || "").toLowerCase() === "clock" && Number(param.min) === 0 && Number(param.max) === 1; }
    function parameterStep(param) { if (isMaxCountParam(param) || param.meta?.edit_as === "int") return 1; const span = Number(param.max) - Number(param.min); return span <= 1 ? 0.01 : span <= 100 ? 0.1 : 1; }
    function shouldCurve(param, min, max) { const name = String(param.name || ""); const unit = String(param.unit || param.meta?.unit || "").toLowerCase(); return /(?:attack|decay|release|env.*time)/i.test(name) || (unit === "ms" && Math.abs(max - min) >= 1000); }
    function curveExponent(param, min, max) { if (Number(param._curveExponent) > 0) return param._curveExponent; const explicit = Number(param.exponent ?? param.meta?.exponent); if (explicit > 0) return (param._curveExponent = explicit); const normalized = Number(param.normalized); const linear = (Number(param.value) - min) / (max - min); if (linear > .0001 && linear < .9999 && normalized > .0001 && normalized < .9999) { const inferred = Math.log(linear) / Math.log(normalized); if (inferred >= .5 && inferred <= 8) return (param._curveExponent = inferred); } return (param._curveExponent = /release/i.test(String(param.name || "")) ? 5 : 3); }
    function valueToSliderPosition(param, value, min, max) { return Math.pow(clamp((Number(value) - min) / (max - min), 0, 1), 1 / curveExponent(param, min, max)); }
    function sliderValue(param, input, min, max, curved) { if (!curved) return Number(input.value); const value = min + ((max - min) * Math.pow(clamp(Number(input.value), 0, 1), curveExponent(param, min, max))); const step = parameterStep(param); return clamp(min + (Math.round((value - min) / step) * step), min, max); }
    function formatParameterValue(value) { return typeof value === "number" ? String(Math.round(value * 100) / 100) : String(value ?? ""); }
    function isLoopback(host) { return !host || host === "127.0.0.1" || host === "localhost" || host === "::1"; }
    function midiNote(value) { const note = integerValue(value, 0); if (note < 0 || note > 127) return "—"; return `${["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"][note % 12]}${Math.floor(note / 12) - 1}`; }
    function integerValue(value, fallback) { const number = Number(value); return Number.isFinite(number) ? Math.round(number) : fallback; }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function reportError(error) { statusEl.textContent = error.message; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]); }
  </script>
</body>
</html>
