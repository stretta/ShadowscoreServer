<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShadowScore Arrange</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <script type="module" src="/shared/shadowscore-nav.js"></script>
  <style>
    :root {
      --bg: var(--ss-bg);
      --band: var(--ss-panel);
      --ink: var(--ss-text);
      --muted: var(--ss-muted);
      --line: var(--ss-border);
      --field: #0f1720;
      --accent: var(--ss-accent-strong);
      --accent-ink: #07110a;
      --danger: var(--ss-danger);
      --focus: var(--ss-warn);
      --soft: var(--ss-surface);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .status {
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    main {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    section {
      min-width: 0;
    }

    .server {
      align-items: end;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(180px, 260px) auto minmax(220px, 1fr) minmax(160px, 1fr);
    }

    .workspace {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
    }

    .panel {
      background: var(--band);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
      overflow: visible;
    }

    .panel-header {
      align-items: center;
      background: var(--soft);
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      min-height: 42px;
      padding: 8px 10px;
    }

    h2 {
      flex: 1;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      margin: 0;
      text-transform: uppercase;
    }

    .panel-body {
      display: grid;
      gap: 12px;
      min-width: 0;
      padding: 12px;
    }

    .panel-body > * {
      min-width: 0;
    }

    label {
      color: var(--muted);
      display: grid;
      font-size: 12px;
      font-weight: 700;
      gap: 4px;
      letter-spacing: 0;
    }

    input,
    select,
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      min-height: 34px;
    }

    input,
    select {
      background: var(--field);
      color: var(--ink);
      padding: 6px 8px;
      width: 100%;
    }

    button {
      color: var(--ink);
      font-weight: 750;
      white-space: nowrap;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    button.danger {
      border-color: #e2aaa5;
      color: var(--danger);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input:focus,
    select:focus,
    button:focus-visible,
    .chain-row:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .list {
      display: grid;
      gap: 6px;
    }

    .block-button {
      align-items: center;
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr auto auto;
      min-height: 40px;
      text-align: left;
      width: 100%;
    }

    .block-button[aria-selected="true"] {
      background: rgba(143, 236, 121, 0.12);
      border-color: rgba(143, 236, 121, 0.48);
    }

    .block-button[data-active="true"] {
      box-shadow: inset 4px 0 0 var(--focus);
    }

    .block-id {
      font-weight: 850;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-duration {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .block-active {
      color: var(--focus);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .wide {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 6px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 12px;
      font-weight: 800;
    }

    td:first-child {
      color: var(--muted);
      font-weight: 750;
      width: 34%;
    }

    .chain {
      align-items: stretch;
      display: flex;
      gap: 3px;
      min-width: 0;
      overflow: hidden;
      padding: 2px;
      width: 100%;
    }

    .playhead {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      min-width: 0;
    }

    .playhead > label,
    .playback-status {
      grid-column: 1 / -1;
      min-width: 0;
    }

    .performance-controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      grid-column: 1 / -1;
    }

    .performance-group {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .performance-group strong {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      min-width: 92px;
      text-transform: uppercase;
    }

    .playback-status {
      align-self: center;
      display: grid;
      gap: 2px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .macro-panel {
      grid-column: 1 / -1;
      order: -1;
    }

    .macro-panel .actions {
      padding-bottom: 2px;
    }

    .playback-status strong {
      color: var(--ink);
      font-size: 0.9rem;
    }

    .chain-row {
      align-items: center;
      background: rgba(15, 23, 32, 0.72);
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: grab;
      display: flex;
      flex-basis: 0;
      flex-shrink: 1;
      justify-content: center;
      min-height: 58px;
      min-width: 0;
      overflow: visible;
      padding: 6px 3px;
      position: relative;
      user-select: none;
    }

    .chain-row[data-active="true"] {
      border-color: var(--focus);
    }

    .chain-row[data-selected="true"] {
      background: rgba(105, 199, 223, 0.12);
      border-color: rgba(105, 199, 223, 0.8);
    }

    .chain-row.dragging {
      opacity: 0.45;
    }

    .chain-row.drop-before::before,
    .chain-row.drop-after::after {
      background: var(--accent);
      border-radius: 2px;
      bottom: -3px;
      content: "";
      pointer-events: none;
      position: absolute;
      top: -3px;
      width: 3px;
      z-index: 4;
    }

    .chain-row.drop-before::before {
      left: -3px;
    }

    .chain-row.drop-after::after {
      right: -3px;
    }

    .arrangement-wiper {
      background: #ffd166;
      bottom: 0;
      box-shadow: 0 0 4px rgba(255, 209, 102, 0.45);
      left: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      transform: translate3d(0, 0, 0);
      width: 2px;
      will-change: transform;
      z-index: 2;
    }

    .arrangement-wiper[hidden] {
      display: none;
    }

    .chain-row > * {
      min-width: 0;
    }

    .chain-label {
      font-size: clamp(0.72rem, 1.5vw, 1rem);
      font-weight: 850;
      max-width: 100%;
      overflow: hidden;
      padding: 0 4px;
      pointer-events: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      z-index: 1;
    }

    .tempo-controls {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-column: 1 / -1;
      grid-template-columns: minmax(110px, 1fr) auto auto;
    }

    .check-control {
      align-items: center;
      display: flex;
      gap: 7px;
      min-height: 34px;
    }

    .check-control input {
      min-height: 0;
      width: auto;
    }

    .empty {
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
      }
    }

    @media (max-width: 720px) {
      .status {
        text-align: left;
        white-space: normal;
      }

      .server,
      .workspace,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="ss-route-tabs" aria-label="ShadowScore navigation" data-shadow-nav>
    <a href="/piano-roll">ShadowScore</a>
    <a href="/structure-editor" aria-current="page">Arrange</a>
    <a href="/editors">OSC</a>
    <a href="/">Setup</a>
  </nav>
  <main>
    <section class="server" aria-label="Server">
      <label>Server
        <select id="server-select"></select>
      </label>
      <button id="discover" type="button">Scan</button>
      <label>Custom server
        <input id="server" placeholder="http://pt5.local:8790">
      </label>
      <div class="status" id="status">Loading session...</div>
    </section>
    <div id="playback-update" aria-label="Playback application status"></div>

    <div class="workspace">
      <section class="panel" aria-label="Blocks">
        <div class="panel-header">
          <h2>Blocks</h2>
          <button id="add-block" type="button">New Block</button>
        </div>
        <div class="panel-body">
          <div class="list" id="block-list"></div>
        </div>
      </section>

      <section class="panel" aria-label="Selected block assignments">
        <div class="panel-header">
          <h2>Block Assignments</h2>
          <button id="duplicate-block" type="button">Duplicate Block</button>
          <button class="danger" id="delete-block" type="button">Remove Block</button>
        </div>
        <div class="panel-body">
          <div class="form-grid">
            <label>Block ID
              <input id="block-id" spellcheck="false">
            </label>
            <label>Duration Unit
              <select id="duration-unit">
                <option value="bars">Bars</option>
                <option value="beats">Beats</option>
              </select>
            </label>
            <label>Duration
              <input id="duration-value" type="number" min="0.001" step="0.001" value="8">
            </label>
            <label>Written Tempo
              <input id="tempo" type="number" min="20" max="400" step="0.01" value="120">
            </label>
            <label>Scale Metadata Root
              <select id="scale-root">
              </select>
            </label>
            <label class="wide">Scale Metadata
              <input id="scale-name" spellcheck="false" placeholder="Ionian" required>
            </label>
            <label>Block TTID
              <input id="block-ttid" type="number" min="0" max="4095" step="1">
            </label>
            <label>Block Swing
              <select id="block-swing"><option value="0">Off</option><option value="1">On</option></select>
            </label>
            <label>Block Swing Amount
              <input id="block-swing-amt" type="number" min="0.5" max="1" step="0.001">
            </label>
          </div>
          <div>
            <table>
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Assigned Clip</th>
                </tr>
              </thead>
              <tbody id="players"></tbody>
            </table>
            <div class="empty" id="players-empty">No players in this score.</div>
          </div>
          <div class="actions">
            <button id="revert-block" type="button">Revert</button>
            <span class="status" id="block-save-state">Saved</span>
          </div>
        </div>
      </section>

      <section class="panel macro-panel" aria-label="Arrangement">
        <div class="panel-header">
          <h2>Arrangement</h2>
          <button id="add-chain" type="button">Add to Arrangement</button>
        </div>
        <div class="panel-body">
          <div class="playhead" aria-label="Transport">
            <label>Playing Block
              <select id="active-block"></select>
            </label>
            <button id="set-active-block" type="button">Cue Section</button>
            <button id="advance-block" type="button">Next Section</button>
            <button id="reset-block" type="button">Return to Start</button>
            <div class="performance-controls">
              <div class="performance-group" aria-label="Players">
                <strong>Players</strong>
                <button class="primary" id="players-play" type="button">Play</button>
                <button id="players-stop" type="button">Stop</button>
              </div>
              <div class="performance-group" aria-label="Arrangement">
                <strong>Arrangement</strong>
                <button class="primary" id="arrangement-run" type="button">Run</button>
                <button id="arrangement-hold" type="button">Hold</button>
              </div>
            </div>
            <div class="tempo-controls" aria-label="Live tempo">
              <label>Live Tempo
                <input id="live-tempo" type="number" min="20" max="400" step="0.01" value="120">
              </label>
              <label class="check-control">
                <input id="follow-block-tempo" type="checkbox" checked>
                Follow Block Tempo
              </label>
              <button id="use-block-tempo" type="button">Use Block Tempo Now</button>
            </div>
            <div class="playback-status" id="macro-playback-status">
              <strong id="macro-playback-state">Players stopped · Arrangement held</strong>
              <span id="macro-playback-detail">A · 1/6 · -- remaining</span>
            </div>
          </div>
          <div class="chain" id="chain"></div>
          <div class="actions">
            <button id="revert-macro" type="button">Revert</button>
            <span class="status" id="macro-save-state">Saved</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { suggestedDuplicateBlockId } from "/shared/block-id.js";
    import { createWiperEstimator } from "/shared/wiper-estimator.js";

    import { createShadowScoreClientState } from "../shared/shadowscore-client-state.js";
    import { createPlaybackUpdateControl } from "../shared/playback-update-control.js";

    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const wiperEstimator = createWiperEstimator({ staleAfterMs: 750, correctionMs: 180, snapThresholdBeats: 0.25 });
    const state = {
      score: undefined,
      session: undefined,
      serverUrl: "",
      servers: [],
      client: undefined,
      unsubscribeClient: undefined,
      eventSource: undefined,
      selectedBlockId: "",
      selectedChainIndex: undefined,
      macroPlayback: undefined,
      performanceControls: undefined,
      tempoPolicy: undefined,
      liveTempoDirty: false,
      macroPlaybackTimer: undefined,
      playbackPollTimer: undefined,
      playbackRequest: undefined,
      playbackGeneration: 0,
      wiperFrame: undefined,
      draggedChainIndex: undefined,
      blockDirty: false,
      macroDirty: false,
      saving: false,
      structureSaveTimer: undefined
    };

    const els = {
      status: document.querySelector("#status"),
      serverSelect: document.querySelector("#server-select"),
      discover: document.querySelector("#discover"),
      server: document.querySelector("#server"),
      blockList: document.querySelector("#block-list"),
      addBlock: document.querySelector("#add-block"),
      duplicateBlock: document.querySelector("#duplicate-block"),
      deleteBlock: document.querySelector("#delete-block"),
      blockId: document.querySelector("#block-id"),
      durationUnit: document.querySelector("#duration-unit"),
      durationValue: document.querySelector("#duration-value"),
      scaleRoot: document.querySelector("#scale-root"),
      scaleName: document.querySelector("#scale-name"),
      blockTtid: document.querySelector("#block-ttid"),
      blockSwing: document.querySelector("#block-swing"),
      blockSwingAmt: document.querySelector("#block-swing-amt"),
      players: document.querySelector("#players"),
      playersEmpty: document.querySelector("#players-empty"),
      revertBlock: document.querySelector("#revert-block"),
      blockSaveState: document.querySelector("#block-save-state"),
      tempo: document.querySelector("#tempo"),
      activeBlock: document.querySelector("#active-block"),
      setActiveBlock: document.querySelector("#set-active-block"),
      advanceBlock: document.querySelector("#advance-block"),
      resetBlock: document.querySelector("#reset-block"),
      playersPlay: document.querySelector("#players-play"),
      playersStop: document.querySelector("#players-stop"),
      arrangementRun: document.querySelector("#arrangement-run"),
      arrangementHold: document.querySelector("#arrangement-hold"),
      liveTempo: document.querySelector("#live-tempo"),
      followBlockTempo: document.querySelector("#follow-block-tempo"),
      useBlockTempo: document.querySelector("#use-block-tempo"),
      macroPlaybackStatus: document.querySelector("#macro-playback-status"),
      macroPlaybackState: document.querySelector("#macro-playback-state"),
      macroPlaybackDetail: document.querySelector("#macro-playback-detail"),
      chain: document.querySelector("#chain"),
      addChain: document.querySelector("#add-chain"),
      revertMacro: document.querySelector("#revert-macro"),
      macroSaveState: document.querySelector("#macro-save-state")
    };

    createPlaybackUpdateControl({
      root: document.querySelector("#playback-update"),
      serverUrl: () => state.serverUrl,
      getBlockId: () => state.selectedBlockId || state.score?.structureState?.activeBlockId || ""
    });

    initScaleRoots();
    bindEvents();
    await discoverServers();

    function bindEvents() {
      els.discover.addEventListener("click", discoverServers);
      els.serverSelect.addEventListener("change", () => {
        els.server.value = els.serverSelect.value;
        void loadServer(els.serverSelect.value);
      });
      els.server.addEventListener("change", () => {
        void loadServer(els.server.value);
      });
      els.addBlock.addEventListener("click", () => void addBlock());
      els.duplicateBlock.addEventListener("click", duplicateBlock);
      els.deleteBlock.addEventListener("click", deleteBlock);
      els.revertBlock.addEventListener("click", () => {
        if (state.selectedBlockId) {
          state.client?.revertDraft(blockDraftKey(state.selectedBlockId));
        }
        state.blockDirty = false;
        state.score = state.client?.effectiveScore() ?? state.score;
        renderBlockEditor();
      });
      els.addChain.addEventListener("click", () => {
        void addChainEntry();
      });
      els.revertMacro.addEventListener("click", () => {
        state.macroDirty = false;
        renderMacroEditor();
      });
      els.activeBlock.addEventListener("change", () => {
        void setActiveBlock();
      });
      els.setActiveBlock.addEventListener("click", setActiveBlock);
      els.advanceBlock.addEventListener("click", advanceBlock);
      els.resetBlock.addEventListener("click", resetBlock);
      els.playersPlay.addEventListener("click", () => void runPerformanceAction("/transport/players/play", { mode: "auto" }, "Starting players..."));
      els.playersStop.addEventListener("click", () => void runPerformanceAction("/transport/players/stop", {}, "Stopping players..."));
      els.arrangementRun.addEventListener("click", () => void runPerformanceAction("/transport/arrangement/run", { mode: "auto" }, "Running arrangement..."));
      els.arrangementHold.addEventListener("click", () => void runPerformanceAction("/transport/arrangement/hold", {}, "Holding arrangement..."));
      els.liveTempo.addEventListener("input", () => {
        state.liveTempoDirty = true;
      });
      els.liveTempo.addEventListener("change", () => void setLiveTempo());
      els.followBlockTempo.addEventListener("change", () => void setFollowBlockTempo());
      els.useBlockTempo.addEventListener("click", () => void useBlockTempo());
      [els.blockId, els.durationUnit, els.durationValue, els.tempo, els.scaleRoot, els.scaleName, els.blockTtid, els.blockSwing, els.blockSwingAmt].forEach((el) => {
        el.addEventListener("input", () => {
          markBlockDirty();
        });
        el.addEventListener("change", () => {
          markBlockDirty();
        });
      });
    }

    async function discoverServers() {
      setStatus("Scanning for local ShadowScore servers...");
      els.discover.disabled = true;
      try {
        const servers = (await Promise.all(serverCandidates().map(async (url) => {
          try {
            return { url, session: await fetchJson(`${url}/session`, 1200) };
          } catch {
            return undefined;
          }
        }))).filter(Boolean);
        state.servers = servers;
        renderServerOptions();
        if (!servers.length) {
          setStatus("No local ShadowScore servers found.");
          return;
        }
        const preferred = servers.find((entry) => entry.url === currentServerUrl()) ?? servers[0];
        els.serverSelect.value = preferred.url;
        els.server.value = preferred.url;
        await loadServer(preferred.url, preferred.session);
      } finally {
        els.discover.disabled = false;
      }
    }

    async function loadServer(url, session) {
      const serverUrl = normalizeServerUrl(url);
      if (!serverUrl) {
        setStatus("Enter a ShadowScore server URL.");
        return;
      }
      if (!confirmDiscard()) {
        els.server.value = state.serverUrl;
        els.serverSelect.value = state.serverUrl;
        return;
      }
      closeEvents();
      state.serverUrl = serverUrl;
      state.playbackGeneration = 0;
      els.server.value = serverUrl;
      setStatus(`Loading ${serverUrl}...`);
      try {
        state.unsubscribeClient?.();
        state.client = createShadowScoreClientState({ serverUrl });
        state.unsubscribeClient = state.client.subscribe((snapshot, reason) => {
          state.session = snapshot.session ?? state.session;
          state.score = state.client.effectiveScore();
          if (reason === "draft") {
            return;
          }
          handleClientScoreUpdate();
        });
        const snapshot = await state.client.load(serverUrl);
        if (session) {
          state.session = session;
        } else {
          state.session = snapshot.session;
        }
        state.score = state.client.effectiveScore();
        state.macroPlayback = state.session.macroPlayback;
        state.performanceControls = undefined;
        state.tempoPolicy = undefined;
        state.blockDirty = false;
        state.macroDirty = false;
        state.selectedBlockId = firstBlockId();
        if (!state.servers.some((entry) => entry.url === serverUrl)) {
          state.servers = [{ url: serverUrl, session: state.session }, ...state.servers];
        }
        renderServerOptions();
        els.serverSelect.value = serverUrl;
        renderAll();
        await refreshPerformanceSnapshot();
        startPlaybackPolling();
        connectEvents();
        setStatus(`Connected to ${serverLabel(serverUrl, state.session)}.`);
      } catch (error) {
        setStatus(`Load failed: ${error.message}`);
      }
    }

    function connectEvents() {
      const events = state.client.connectEvents();
      events.onerror = () => {
        setStatus("Structure updates disconnected.");
      };
      state.eventSource = events;
    }

    function handleClientScoreUpdate() {
      if (state.macroPlayback?.running) {
        state.macroPlayback = {
          ...state.macroPlayback,
          activeBlockId: state.score.structureState?.activeBlockId ?? "",
          macroIndex: state.score.structureState?.macroIndex ?? 0
        };
        void refreshMacroPlayback();
      }
      if (!state.score.mesostructure?.[state.selectedBlockId]) {
        state.selectedBlockId = firstBlockId();
        state.blockDirty = false;
      }
      if (!state.blockDirty && !state.macroDirty && !state.saving) {
        renderAll();
      } else {
        renderBlockList();
        updateButtons();
      }
    }

    function renderAll() {
      renderBlockList();
      renderBlockEditor();
      renderMacroEditor();
      updateButtons();
    }

    function renderServerOptions() {
      els.serverSelect.innerHTML = "";
      state.servers.forEach((entry) => {
        const option = document.createElement("option");
        option.value = entry.url;
        option.textContent = serverLabel(entry.url, entry.session);
        els.serverSelect.append(option);
      });
    }

    function renderBlockList() {
      els.blockList.innerHTML = "";
      const blocks = Object.entries(state.score?.mesostructure ?? {});
      if (!blocks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No blocks.";
        els.blockList.append(empty);
        return;
      }
      blocks.sort(([a], [b]) => naturalCompare(a, b)).forEach(([blockId, block]) => {
        const button = document.createElement("button");
        button.className = "block-button";
        button.type = "button";
        button.setAttribute("aria-selected", String(blockId === state.selectedBlockId));
        button.dataset.active = String(blockId === state.score?.structureState?.activeBlockId);
        button.addEventListener("click", () => void selectBlock(blockId));

        const id = document.createElement("span");
        id.className = "block-id";
        id.textContent = blockId;
        const duration = document.createElement("span");
        duration.className = "block-duration";
        duration.textContent = durationLabel(block);
        button.append(id, duration);
        if (blockId === state.score?.structureState?.activeBlockId) {
          const active = document.createElement("span");
          active.className = "block-active";
          active.textContent = "Playing";
          button.append(active);
        }
        els.blockList.append(button);
      });
    }

    function renderBlockEditor() {
      const block = currentBlock();
      const enabled = Boolean(block);
      [els.blockId, els.durationUnit, els.durationValue, els.tempo, els.scaleRoot, els.scaleName, els.blockTtid, els.blockSwing, els.blockSwingAmt].forEach((el) => {
        el.disabled = !enabled;
      });
      els.scaleRoot.disabled = true;
      els.scaleName.disabled = true;
      els.players.innerHTML = "";
      if (!block) {
        els.blockId.value = "";
        els.durationValue.value = "8";
        els.tempo.value = "120";
        els.playersEmpty.hidden = false;
        updateButtons();
        return;
      }
      const [durationUnit, durationValue] = durationParts(block);
      els.blockId.value = state.selectedBlockId;
      els.durationUnit.value = durationUnit;
      els.durationValue.value = String(durationValue);
      els.tempo.value = String(block.tempo ?? 120);
      els.scaleRoot.value = Number.isFinite(block.scale?.root_note) ? String(block.scale.root_note) : "";
      els.scaleName.value = block.scale?.scale_name ?? "";
      els.blockTtid.value = String(block.ttid ?? 2741);
      els.blockSwing.value = String(block.swing ?? 0);
      els.blockSwingAmt.value = String(block.swingAmt ?? 0.5);

      const voices = state.session?.voices ?? Object.keys(state.score?.voices ?? {}).map((id) => ({ id, label: id }));
      els.playersEmpty.hidden = voices.length > 0;
      voices.forEach((voice) => {
        const row = document.createElement("tr");
        const label = document.createElement("td");
        label.textContent = voice.assignment?.label || voice.label || voice.id;
        const clip = document.createElement("td");
        const input = clipSelectForVoice(voice.id, block.players?.[voice.id]?.clipId ?? "");
        input.addEventListener("change", async () => {
          if (input.value === "__create__") {
            await createClipForSlot(input, voice.id);
            return;
          }
          markBlockDirty();
        });
        clip.append(input);
        row.append(label, clip);
        els.players.append(row);
      });
      updateButtons();
    }

    function renderMacroEditor() {
      const macro = state.score?.macrostructure ?? { blocks: [] };
      renderPlayheadControls();
      els.chain.innerHTML = "";
      (macro.blocks ?? []).forEach((blockId, index) => {
        els.chain.append(chainRow(index, blockId));
      });
      if (!(macro.blocks ?? []).length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No playback chain entries.";
        els.chain.append(empty);
      }
      scheduleWiperFrame();
      updateButtons();
    }

    function renderPlayheadControls() {
      const blockIds = Object.keys(state.score?.mesostructure ?? {}).sort(naturalCompare);
      els.activeBlock.replaceChildren(...blockIds.map((blockId) => {
        const option = document.createElement("option");
        option.value = blockId;
        option.textContent = blockId;
        return option;
      }));
      const activeBlockId = state.score?.structureState?.activeBlockId;
      els.activeBlock.value = blockIds.includes(activeBlockId) ? activeBlockId : blockIds[0] ?? "";
      renderMacroPlaybackStatus();
    }

    function renderMacroPlaybackStatus() {
      const playback = state.macroPlayback;
      const playersPlaying = Boolean(state.performanceControls?.players?.playing);
      const arrangementRunning = Boolean(state.performanceControls?.arrangement?.running ?? playback?.running);
      els.macroPlaybackState.textContent = `${playersPlaying ? "Players playing" : "Players stopped"} · ${arrangementRunning ? "Arrangement running" : "Arrangement held"}`;
      if (state.tempoPolicy) {
        if (!state.liveTempoDirty) {
          els.liveTempo.value = String(state.tempoPolicy.live ?? 120);
        }
        els.followBlockTempo.checked = Boolean(state.tempoPolicy.followBlockTempo);
      }
      if (!playback?.running) {
        stopMacroPlaybackTimer();
        els.macroPlaybackDetail.textContent = playbackDetailText(playback);
        return;
      }
      els.macroPlaybackDetail.textContent = playbackDetailText(playback);
      startMacroPlaybackTimer();
    }

    function playbackDetailText(playback = state.macroPlayback) {
      const macroBlocks = state.score?.macrostructure?.blocks ?? [];
      const activeBlockId = playback?.activeBlockId || state.score?.structureState?.activeBlockId || "";
      const macroIndex = Number.isFinite(playback?.macroIndex)
        ? playback.macroIndex
        : Math.max(0, macroBlocks.indexOf(activeBlockId));
      const position = macroBlocks.length ? `${macroIndex + 1}/${macroBlocks.length}` : "0/0";
      const remaining = playback?.running ? `${formatRemaining(playback.nextAdvanceAt)} remaining` : "-- remaining";
      return `${activeBlockId || "No block"} · ${position} · ${remaining}`;
    }

    function formatRemaining(nextAdvanceAt) {
      if (!Number.isFinite(Number(nextAdvanceAt))) {
        return "--";
      }
      const remainingMs = Math.max(0, Number(nextAdvanceAt) - Date.now());
      const totalSeconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes > 0 ? `${minutes}:${String(seconds).padStart(2, "0")}` : `${seconds}s`;
    }

    function startMacroPlaybackTimer() {
      if (state.macroPlaybackTimer !== undefined) {
        return;
      }
      state.macroPlaybackTimer = window.setInterval(() => {
        if (!state.macroPlayback?.running) {
          stopMacroPlaybackTimer();
          renderMacroPlaybackStatus();
          return;
        }
        els.macroPlaybackDetail.textContent = playbackDetailText();
      }, 1000);
    }

    function stopMacroPlaybackTimer() {
      if (state.macroPlaybackTimer === undefined) {
        return;
      }
      window.clearInterval(state.macroPlaybackTimer);
      state.macroPlaybackTimer = undefined;
    }

    function chainRow(index, blockId) {
      const row = document.createElement("div");
      row.className = "chain-row";
      row.draggable = true;
      row.tabIndex = 0;
      row.dataset.chainIndex = String(index);
      row.dataset.blockId = blockId;
      row.dataset.active = String(index === Number(state.score?.structureState?.macroIndex));
      row.dataset.selected = String(index === state.selectedChainIndex);
      row.style.flexGrow = String(blockDurationBeats(state.score?.mesostructure?.[blockId]));
      row.setAttribute("aria-label", `Arrangement occurrence ${index + 1}: ${blockId}. Drag to reorder. Press Backspace or Delete to remove.`);
      const label = document.createElement("div");
      label.className = "chain-label";
      label.textContent = blockId;
      row.addEventListener("click", () => {
        void selectBlock(blockId, { occurrenceIndex: Number(row.dataset.chainIndex) });
      });
      row.addEventListener("dragstart", () => {
        state.draggedChainIndex = Number(row.dataset.chainIndex);
        row.classList.add("dragging");
      });
      row.addEventListener("dragover", (event) => {
        event.preventDefault();
        if (Number(row.dataset.chainIndex) === state.draggedChainIndex) {
          clearDropIndicators();
          return;
        }
        const bounds = row.getBoundingClientRect();
        const placement = event.clientX < bounds.left + (bounds.width / 2) ? "before" : "after";
        clearDropIndicators(row);
        row.classList.toggle("drop-before", placement === "before");
        row.classList.toggle("drop-after", placement === "after");
        row.dataset.dropPlacement = placement;
      });
      row.addEventListener("dragleave", () => {
        row.classList.remove("drop-before", "drop-after");
        delete row.dataset.dropPlacement;
      });
      row.addEventListener("drop", (event) => {
        event.preventDefault();
        const targetIndex = Number(row.dataset.chainIndex);
        const placement = row.dataset.dropPlacement || "before";
        clearDropIndicators();
        if (Number.isInteger(state.draggedChainIndex) && state.draggedChainIndex !== targetIndex) {
          void reorderChain(state.draggedChainIndex, targetIndex, placement);
        }
      });
      row.addEventListener("dragend", () => {
        state.draggedChainIndex = undefined;
        row.classList.remove("dragging");
        clearDropIndicators();
      });
      row.addEventListener("keydown", (event) => {
        if (!["Backspace", "Delete"].includes(event.key)) {
          return;
        }
        event.preventDefault();
        void removeChainEntry(Number(row.dataset.chainIndex));
      });
      const wiper = document.createElement("div");
      wiper.className = "arrangement-wiper";
      wiper.setAttribute("aria-hidden", "true");
      wiper.hidden = true;
      row.append(label, wiper);
      return row;
    }

    function clearDropIndicators(exceptRow) {
      els.chain.querySelectorAll(".drop-before, .drop-after").forEach((entry) => {
        if (entry === exceptRow) {
          return;
        }
        entry.classList.remove("drop-before", "drop-after");
        delete entry.dataset.dropPlacement;
      });
    }

    async function reorderChain(fromIndex, targetIndex, placement = "before") {
      const rows = [...els.chain.querySelectorAll(".chain-row")];
      const moving = rows[fromIndex];
      const target = rows[targetIndex];
      if (!moving || !target || moving === target) {
        return;
      }
      const selectedRow = Number.isInteger(state.selectedChainIndex)
        ? rows[state.selectedChainIndex]
        : undefined;
      if (placement === "after") {
        target.after(moving);
      } else {
        target.before(moving);
      }
      const reorderedRows = chainRows();
      const destinationIndex = reorderedRows.indexOf(moving);
      if (destinationIndex === fromIndex) {
        return;
      }
      state.selectedChainIndex = selectedRow ? reorderedRows.indexOf(selectedRow) : undefined;
      renumberChain();
      await persistMacrostructure("Reordering arrangement...", "Reordered arrangement.");
      els.chain.querySelector(`.chain-row[data-chain-index="${destinationIndex}"]`)?.focus();
    }

    async function removeChainEntry(index) {
      const rows = chainRows();
      if (rows.length <= 1) {
        setStatus("The arrangement must keep at least one occurrence.");
        return;
      }
      const row = rows[index];
      if (!row) {
        return;
      }
      row.remove();
      state.selectedChainIndex = undefined;
      renumberChain();
      await persistMacrostructure("Removing arrangement entry...", "Removed arrangement entry.");
    }

    async function selectBlock(blockId, options = {}) {
      state.selectedChainIndex = Number.isInteger(options.occurrenceIndex)
        ? options.occurrenceIndex
        : undefined;
      if (blockId === state.selectedBlockId) {
        updateArrangementSelection();
        return;
      }
      if (state.blockDirty) await saveBlock();
      state.selectedBlockId = blockId;
      state.blockDirty = false;
      state.client?.revertDraft(blockDraftKey(blockId));
      renderBlockList();
      renderBlockEditor();
      updateArrangementSelection();
    }

    async function addBlock() {
      if (!state.score) {
        return;
      }
      if (state.blockDirty) await saveBlock();
      const id = nextBlockId();
      state.score = {
        ...state.score,
        mesostructure: {
          ...state.score.mesostructure,
          [id]: {
            duration: { bars: 4 },
            tempo: 120,
            scale: { root_note: 0, scale_name: "Ionian", scale_intervals: [0, 2, 4, 5, 7, 9, 11] },
            ttid: 2741,
            swing: 0,
            swingAmt: 0.5,
            players: {}
          }
        }
      };
      state.selectedBlockId = id;
      state.blockDirty = true;
      state.client?.beginDraft(blockDraftKey(id), state.score.mesostructure[id]);
      state.score = state.client?.effectiveScore() ?? state.score;
      renderAll();
      queueStructureAutosave();
    }

    async function deleteBlock() {
      if (!state.score || !state.selectedBlockId || !window.confirm(`Remove block ${state.selectedBlockId}?`)) {
        return;
      }
      const blockId = state.selectedBlockId;
      setStatus(`Removing ${blockId}...`);
      try {
        state.saving = true;
        state.score = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(blockId)}`, undefined, {
          method: "DELETE"
        });
        state.selectedBlockId = firstBlockId();
        state.blockDirty = false;
        state.client?.revertDraft(blockDraftKey(blockId));
        state.macroDirty = false;
        state.client?.adoptServerScore(state.score);
        renderAll();
        setStatus(`Removed ${blockId}.`);
      } catch (error) {
        setStatus(`Remove failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    async function duplicateBlock() {
      if (!state.score || !state.selectedBlockId) {
        return;
      }
      if (state.blockDirty && !window.confirm("Discard unsaved block edits before duplicating?")) {
        return;
      }
      const sourceBlockId = state.selectedBlockId;
      const targetBlockId = normalizeId(window.prompt(
        `Duplicate block ${sourceBlockId} as`,
        suggestedDuplicateBlockId(sourceBlockId, Object.keys(state.score?.mesostructure ?? {}))
      ));
      if (!targetBlockId) {
        return;
      }
      setStatus(`Duplicating ${sourceBlockId} as ${targetBlockId}...`);
      try {
        state.saving = true;
        state.score = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(sourceBlockId)}/duplicate`, undefined, {
          method: "POST",
          body: {
            blockId: targetBlockId,
            ...expectedStructureRevisionFields()
          }
        });
        state.selectedBlockId = targetBlockId;
        state.blockDirty = false;
        state.client?.revertDraft(blockDraftKey(sourceBlockId));
        state.client?.adoptServerScore(state.score);
        renderAll();
        setStatus(`Duplicated ${sourceBlockId} as ${targetBlockId}.`);
      } catch (error) {
        setStatus(`Duplicate failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    async function saveBlock() {
      if (!state.score || !state.selectedBlockId || !state.blockDirty) {
        return;
      }
      const originalId = state.selectedBlockId;
      const nextId = normalizeId(els.blockId.value);
      if (!nextId) {
        setStatus("Block ID is required.");
        return;
      }
      const desiredTtid = Math.max(0, Math.min(4095, Math.round(numberValue(els.blockTtid.value, 2741))));
      const desiredSwing = els.blockSwing.value === "1" ? 1 : 0;
      const desiredSwingAmt = Math.max(0.5, Math.min(1, numberValue(els.blockSwingAmt.value, 0.5)));
      const block = blockFromForm();
      setStatus(`Saving block ${nextId}...`);
      try {
        state.saving = true;
        const draft = state.client?.draft(blockDraftKey(originalId));
        let score = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(nextId)}`, undefined, {
          method: "POST",
          body: withExpectedStructureRevision(block, draft)
        });
        state.client?.adoptServerScore(score);
        if (Number(score.mesostructure?.[nextId]?.ttid) !== desiredTtid) {
          const response = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(nextId)}/ttid`, undefined, {
            method: "PUT",
            body: {
              ttid: desiredTtid,
              expectedScoreRevision: score.scoreRevision ?? score.version,
              expectedStructureRevision: score.structureRevision,
              auditionTargets: []
            }
          });
          score = response.score;
          state.client?.adoptServerScore(score);
        }
        if (Number(score.mesostructure?.[nextId]?.swing) !== desiredSwing
          || Number(score.mesostructure?.[nextId]?.swingAmt) !== desiredSwingAmt) {
          const response = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(nextId)}/swing`, undefined, {
            method: "PUT",
            body: {
              swing: desiredSwing,
              swingAmt: desiredSwingAmt,
              expectedScoreRevision: score.scoreRevision ?? score.version,
              expectedStructureRevision: score.structureRevision,
              auditionTargets: []
            }
          });
          score = response.score;
          state.client?.adoptServerScore(score);
        }
        if (originalId !== nextId && score.mesostructure?.[originalId]) {
          score = await fetchJson(`${state.serverUrl}/macrostructure`, undefined, {
            method: "POST",
            body: withExpectedStructureRevision({
              ...score.macrostructure,
              blocks: (score.macrostructure?.blocks ?? []).map((blockId) => blockId === originalId ? nextId : blockId)
            })
          });
          state.client?.adoptServerScore(score);
          score = await fetchJson(`${state.serverUrl}/mesostructure/${encodeURIComponent(originalId)}`, undefined, {
            method: "DELETE"
          });
          state.client?.adoptServerScore(score);
        }
        state.score = score;
        state.selectedBlockId = nextId;
        state.blockDirty = false;
        state.client?.revertDraft(blockDraftKey(originalId));
        state.client?.revertDraft(blockDraftKey(nextId));
        state.macroDirty = false;
        renderAll();
        setStatus(`Saved block ${nextId}.`);
      } catch (error) {
        setStatus(`Save failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    async function addChainEntry() {
      const blockIds = Object.keys(state.score?.mesostructure ?? {}).sort(naturalCompare);
      if (!blockIds.length) {
        return;
      }
      const empty = els.chain.querySelector(".empty");
      empty?.remove();
      const index = chainRows().length;
      state.selectedChainIndex = index;
      els.chain.append(chainRow(index, state.selectedBlockId || blockIds[0]));
      await persistMacrostructure("Adding playback chain entry...", "Added playback chain entry.");
    }

    async function persistMacrostructure(savingMessage, savedMessage) {
      state.macroDirty = true;
      updateButtons();
      await saveMacrostructure(savingMessage, savedMessage);
    }

    async function saveMacrostructure(savingMessage = "Saving playback chain...", savedMessage = "Saved playback chain.") {
      if (!state.score || !state.macroDirty) {
        return;
      }
      const macrostructure = {
        ...state.score.macrostructure,
        blocks: chainRows().map((row) => row.dataset.blockId).filter(Boolean)
      };
      setStatus(savingMessage);
      try {
        state.saving = true;
        updateButtons();
        state.score = await fetchJson(`${state.serverUrl}/macrostructure`, undefined, {
          method: "POST",
          body: withExpectedStructureRevision(macrostructure)
        });
        state.client?.adoptServerScore(state.score);
        state.macroDirty = false;
        renderAll();
        setStatus(savedMessage);
      } catch (error) {
        setStatus(`Macro save failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    async function setActiveBlock() {
      const activeBlockId = els.activeBlock.value || state.selectedBlockId;
      if (!activeBlockId) {
        return;
      }
      await updatePlayhead("/structure/playhead", { activeBlockId });
    }

    async function advanceBlock() {
      await updatePlayhead("/macrostructure/advance", {});
    }

    async function resetBlock() {
      await updatePlayhead("/macrostructure/reset", {});
    }

    async function runPerformanceAction(path, body, pendingMessage) {
      if (!state.score) {
        return;
      }
      setStatus(pendingMessage);
      try {
        state.saving = true;
        const result = await fetchJson(`${state.serverUrl}${path}`, undefined, {
          method: "POST",
          body
        });
        adoptPerformanceTransport(result.transport);
        renderPlayheadControls();
        setStatus(result.transport?.stateText ?? "Updated performance transport.");
      } catch (error) {
        setStatus(`Transport update failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    async function setLiveTempo() {
      const bpm = numberValue(els.liveTempo.value, state.tempoPolicy?.live ?? 120);
      if (await updateTempoPolicy("/transport/tempo", { bpm }, `Live tempo ${bpm} BPM.`)) {
        state.liveTempoDirty = false;
        renderMacroPlaybackStatus();
      }
    }

    async function setFollowBlockTempo() {
      await updateTempoPolicy(
        "/transport/tempo/follow-block",
        { follow: els.followBlockTempo.checked },
        els.followBlockTempo.checked ? "Following written block tempo at boundaries." : "Live tempo is latched across block boundaries."
      );
    }

    async function useBlockTempo() {
      if (await updateTempoPolicy("/transport/tempo/use-block", {}, "Recalled the active block's written tempo.")) {
        state.liveTempoDirty = false;
        renderMacroPlaybackStatus();
      }
    }

    async function updateTempoPolicy(path, body, successMessage) {
      if (!state.score) {
        return false;
      }
      try {
        state.saving = true;
        updateButtons();
        const result = await fetchJson(`${state.serverUrl}${path}`, undefined, {
          method: "POST",
          body
        });
        state.tempoPolicy = result.tempo ?? result.transport?.tempo;
        adoptPerformanceTransport(result.transport);
        renderPlayheadControls();
        setStatus(successMessage);
        return true;
      } catch (error) {
        renderMacroPlaybackStatus();
        setStatus(`Tempo update failed: ${error.message}`);
        return false;
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    function adoptPerformanceTransport(transport) {
      if (!transport) {
        return;
      }
      state.performanceControls = {
        players: transport.players,
        arrangement: transport.arrangement
      };
      state.tempoPolicy = transport.tempo ?? state.tempoPolicy;
      state.macroPlayback = transport.playback ?? state.macroPlayback;
    }

    async function refreshPerformanceSnapshot() {
      if (!state.serverUrl || state.playbackRequest) {
        return;
      }
      const controller = new AbortController();
      state.playbackRequest = controller;
      try {
        const response = await fetch(`${state.serverUrl}/playback/snapshot`, {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) {
          return;
        }
        const snapshot = await response.json();
        if (!Number.isInteger(snapshot.generation) || snapshot.generation <= state.playbackGeneration) {
          return;
        }
        state.playbackGeneration = snapshot.generation;
        state.performanceControls = snapshot.controls;
        state.tempoPolicy = snapshot.tempo;
        state.macroPlayback = snapshot.playback ?? state.macroPlayback;
        const beat = Number(snapshot.playback?.beatIntoBlock);
        if (Number.isFinite(beat)) {
          wiperEstimator.update({
            beat,
            tempo: snapshot.transport?.tempo,
            running: Boolean(snapshot.controls?.arrangement?.running),
            blockId: snapshot.playback?.activeBlockId,
            observedAt: snapshot.observedAt
          }, Date.now());
        } else {
          wiperEstimator.clear();
        }
        applyPlaybackSnapshotToStrip();
        renderMacroPlaybackStatus();
        updateButtons();
        scheduleWiperFrame();
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.warn("Arrange playback snapshot refresh failed", error);
        }
        // The next score/session refresh will recover playback display state.
      } finally {
        if (state.playbackRequest === controller) {
          state.playbackRequest = undefined;
        }
      }
    }

    async function refreshMacroPlayback() {
      await refreshPerformanceSnapshot();
    }

    function startPlaybackPolling() {
      window.clearInterval(state.playbackPollTimer);
      state.playbackPollTimer = window.setInterval(() => void refreshPerformanceSnapshot(), 250);
    }

    function applyPlaybackSnapshotToStrip() {
      const activeIndex = Number(state.macroPlayback?.macroIndex ?? state.score?.structureState?.macroIndex);
      els.chain.querySelectorAll(".chain-row").forEach((row, index) => {
        row.dataset.active = String(index === activeIndex);
      });
    }

    function scheduleWiperFrame() {
      if (state.wiperFrame !== undefined) {
        return;
      }
      state.wiperFrame = window.requestAnimationFrame(() => {
        state.wiperFrame = undefined;
        const view = renderArrangementWiper();
        if (view?.running && !view.stale) {
          scheduleWiperFrame();
        }
      });
    }

    function renderArrangementWiper() {
      const view = wiperEstimator.estimate();
      const activeIndex = Number(state.macroPlayback?.macroIndex ?? state.score?.structureState?.macroIndex);
      const row = els.chain.querySelector(`.chain-row[data-chain-index="${activeIndex}"]`);
      const wipers = els.chain.querySelectorAll(".arrangement-wiper");
      wipers.forEach((wiper) => {
        wiper.hidden = true;
      });
      if (!view || !row || view.blockId !== row.dataset.blockId) {
        return view;
      }
      const duration = Number(state.macroPlayback?.activeBlockDurationBeats)
        || blockDurationBeats(state.score?.mesostructure?.[view.blockId]);
      const ratio = Math.max(0, Math.min(1, view.beat / Math.max(duration, 0.001)));
      const wiper = row.querySelector(".arrangement-wiper");
      wiper.style.transform = `translate3d(${ratio * row.clientWidth}px, 0, 0)`;
      wiper.hidden = false;
      return view;
    }

    async function updatePlayhead(path, body, options = {}) {
      if (!state.score) {
        return;
      }
      setStatus("Updating playback block...");
      try {
        state.saving = true;
        state.score = await fetchJson(`${state.serverUrl}${path}`, undefined, {
          method: "POST",
          body: {
            ...body,
            ...expectedRevisionFields()
          }
        });
        state.client?.adoptServerScore(state.score);
        state.selectedBlockId = state.score.structureState?.activeBlockId || state.selectedBlockId;
        renderAll();
        setStatus(`Playing block ${state.score.structureState?.activeBlockId ?? ""}.`);
      } catch (error) {
        if (!options.retried && isStaleScoreError(error)) {
          state.score = await fetchJson(`${state.serverUrl}/score`);
          await updatePlayhead(path, body, { retried: true });
          return;
        }
        setStatus(`Playhead update failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    function blockFromForm() {
      const unit = els.durationUnit.value === "beats" ? "beats" : "bars";
      const scale = structuredClone(currentBlock()?.scale ?? {
        root_note: 0,
        scale_intervals: [0, 2, 4, 5, 7, 9, 11],
        scale_name: "Ionian"
      });
      const players = {};
      els.players.querySelectorAll("select[data-voice-id]").forEach((input) => {
        const clipId = input.value.trim();
        if (clipId) {
          players[input.dataset.voiceId] = { clipId };
        }
      });
      return {
        ...currentBlock(),
        tempo: numberValue(els.tempo.value, 120),
        duration: { [unit]: numberValue(els.durationValue.value, 8) },
        scale,
        ttid: currentBlock()?.ttid ?? 2741,
        swing: currentBlock()?.swing ?? 0,
        swingAmt: currentBlock()?.swingAmt ?? 0.5,
        players
      };
    }

    function markBlockDirty() {
      if (!state.score || !state.selectedBlockId) {
        return;
      }
      state.blockDirty = true;
      state.client?.updateDraft(blockDraftKey(state.selectedBlockId), blockFromForm());
      state.score = state.client?.effectiveScore() ?? state.score;
      renderBlockList();
      updateButtons();
      queueStructureAutosave();
    }

    function queueStructureAutosave() {
      window.clearTimeout(state.structureSaveTimer);
      state.structureSaveTimer = window.setTimeout(() => void flushStructureAutosave(), 450);
    }

    async function flushStructureAutosave() {
      if (state.saving) {
        queueStructureAutosave();
        return;
      }
      if (state.blockDirty) await saveBlock();
      if (state.macroDirty) await saveMacrostructure();
    }

    function blockDraftKey(blockId) {
      return `mesostructure:${blockId}`;
    }

    function expectedRevisionFields(draft) {
      return {
        expectedVersion: draft?.baseScoreRevision ?? state.score?.version,
        expectedScoreRevision: draft?.baseScoreRevision ?? state.score?.scoreRevision ?? state.score?.version,
        expectedStructureRevision: draft?.baseStructureRevision ?? state.score?.structureRevision
      };
    }

    function withExpectedRevisions(body, draft) {
      return {
        ...body,
        ...expectedRevisionFields(draft)
      };
    }

    function expectedStructureRevisionFields(draft) {
      return {
        expectedStructureRevision: draft?.baseStructureRevision ?? state.score?.structureRevision
      };
    }

    function withExpectedStructureRevision(body, draft) {
      return {
        ...body,
        ...expectedStructureRevisionFields(draft)
      };
    }

    function clipSelectForVoice(voiceId, selectedClipId) {
      const select = document.createElement("select");
      select.dataset.voiceId = voiceId;

      const none = document.createElement("option");
      none.value = "";
      none.textContent = "None";
      select.append(none);

      const create = document.createElement("option");
      create.value = "__create__";
      create.textContent = "Create new clip...";
      select.append(create);

      Object.keys(state.score?.clips ?? {}).sort(naturalCompare).forEach((clipId) => {
        const option = document.createElement("option");
        option.value = clipId;
        option.textContent = clipId;
        select.append(option);
      });

      if (selectedClipId && !state.score?.clips?.[selectedClipId]) {
        const missing = document.createElement("option");
        missing.value = selectedClipId;
        missing.textContent = `${selectedClipId} (missing)`;
        select.append(missing);
      }
      select.value = selectedClipId;
      return select;
    }

    async function createClipForSlot(select, voiceId) {
      const playerLabel = playerLabelForVoice(voiceId);
      const suggestion = `${state.selectedBlockId.toLowerCase()}-${voiceId}`;
      const clipId = normalizeId(window.prompt(`New clip for ${playerLabel} in block ${state.selectedBlockId}`, suggestion));
      if (!clipId) {
        select.value = currentBlock()?.players?.[voiceId]?.clipId ?? "";
        return;
      }
      setStatus(`Creating clip ${clipId} for ${playerLabel}...`);
      try {
        state.saving = true;
        state.score = await fetchJson(`${state.serverUrl}/clips/${encodeURIComponent(clipId)}`, undefined, {
          method: "POST",
          body: withExpectedRevisions(defaultClipDocument())
        });
        state.client?.adoptServerScore(state.score);
        state.blockDirty = true;
        state.client?.updateDraft(blockDraftKey(state.selectedBlockId), blockFromForm());
        state.score = state.client?.effectiveScore() ?? state.score;
        renderBlockList();
        renderMacroEditor();
        renderBlockEditor();
        const refreshed = els.players.querySelector(`select[data-voice-id="${cssEscape(voiceId)}"]`);
        if (refreshed) {
          refreshed.value = clipId;
        }
        state.client?.updateDraft(blockDraftKey(state.selectedBlockId), blockFromForm());
        state.score = state.client?.effectiveScore() ?? state.score;
        await saveBlock();
      } catch (error) {
        select.value = currentBlock()?.players?.[voiceId]?.clipId ?? "";
        setStatus(`Clip creation failed: ${error.message}`);
      } finally {
        state.saving = false;
        updateButtons();
      }
    }

    function defaultClipDocument() {
      return {
        notes: [],
        context: {
          clip: {
            TimeSignature: {
              numerator: 4,
              denominator: 4
            }
          },
          scale: {},
          grid: {},
          seed: 0
        },
        duration: { bars: 2 },
        playbackType: "looped",
        behavior: {
          followsPitch: true,
          followsScale: true,
          transposeMode: "scale-degree"
        }
      };
    }

    function currentBlock() {
      return state.score?.mesostructure?.[state.selectedBlockId];
    }

    function firstBlockId() {
      return Object.keys(state.score?.mesostructure ?? {}).sort(naturalCompare)[0] ?? "";
    }

    function nextBlockId() {
      const existing = new Set(Object.keys(state.score?.mesostructure ?? {}));
      for (const id of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
        if (!existing.has(id)) {
          return id;
        }
      }
      let index = 1;
      while (existing.has(`block-${index}`)) {
        index += 1;
      }
      return `block-${index}`;
    }

    function playerLabelForVoice(voiceId) {
      const voices = state.session?.voices ?? Object.keys(state.score?.voices ?? {}).map((id) => ({ id, label: id }));
      const voice = voices.find((entry) => entry.id === voiceId);
      return voice?.assignment?.label || voice?.label || voiceId;
    }

    function durationParts(block) {
      if (Number.isFinite(block?.duration?.beats)) {
        return ["beats", block.duration.beats];
      }
      return ["bars", Number.isFinite(block?.duration?.bars) ? block.duration.bars : 8];
    }

    function durationLabel(block) {
      const [unit, value] = durationParts(block);
      return `${value} ${unit}`;
    }

    function blockDurationBeats(block) {
      if (Number.isFinite(Number(block?.duration?.beats))) {
        return Math.max(0.001, Number(block.duration.beats));
      }
      const beatsPerBar = Math.max(1, Number(state.score?.context?.clip?.TimeSignature?.numerator) || 4);
      return Math.max(0.001, Number(block?.duration?.bars) || 1) * beatsPerBar;
    }

    function renumberChain() {
      const rows = [...els.chain.querySelectorAll(".chain-row")];
      rows.forEach((row, index) => {
        row.dataset.chainIndex = String(index);
        row.dataset.selected = String(index === state.selectedChainIndex);
        row.setAttribute("aria-label", `Arrangement occurrence ${index + 1}: ${row.dataset.blockId}. Drag to reorder. Press Backspace or Delete to remove.`);
      });
      if (!chainRows().length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No playback chain entries.";
        els.chain.append(empty);
      }
    }

    function chainRows() {
      return [...els.chain.querySelectorAll(".chain-row")];
    }

    function updateArrangementSelection() {
      els.chain.querySelectorAll(".chain-row").forEach((row) => {
        row.dataset.selected = String(Number(row.dataset.chainIndex) === state.selectedChainIndex);
      });
    }

    function updateButtons() {
      const hasScore = Boolean(state.score);
      const hasBlock = Boolean(state.selectedBlockId && currentBlock());
      els.addBlock.disabled = !hasScore || state.saving;
      els.duplicateBlock.disabled = !hasBlock || state.saving;
      els.deleteBlock.disabled = !hasBlock || state.saving;
      els.revertBlock.disabled = !state.blockDirty || state.saving;
      els.addChain.disabled = !hasScore || state.saving || !Object.keys(state.score?.mesostructure ?? {}).length;
      els.revertMacro.disabled = !state.macroDirty || state.saving;
      els.blockSaveState.textContent = state.saving && state.blockDirty ? "Saving…" : state.blockDirty ? "Saving…" : "Saved";
      els.macroSaveState.textContent = state.saving && state.macroDirty ? "Saving…" : state.macroDirty ? "Saving…" : "Saved";
      els.activeBlock.disabled = !hasScore || state.saving || !Object.keys(state.score?.mesostructure ?? {}).length;
      els.setActiveBlock.disabled = !hasScore || state.saving || !els.activeBlock.value;
      els.advanceBlock.disabled = !hasScore || state.saving || !(state.score?.macrostructure?.blocks ?? []).length;
      els.resetBlock.disabled = !hasScore || state.saving;
      const playersPlaying = Boolean(state.performanceControls?.players?.playing);
      const arrangementRunning = Boolean(state.performanceControls?.arrangement?.running ?? state.macroPlayback?.running);
      els.playersPlay.disabled = !hasScore || state.saving || playersPlaying;
      els.playersStop.disabled = !hasScore || state.saving || !playersPlaying;
      els.arrangementRun.disabled = !hasScore || state.saving || !playersPlaying || arrangementRunning || !(state.score?.macrostructure?.blocks ?? []).length;
      els.arrangementHold.disabled = !hasScore || state.saving || !arrangementRunning;
      els.liveTempo.disabled = !hasScore || state.saving;
      els.followBlockTempo.disabled = !hasScore || state.saving;
      els.useBlockTempo.disabled = !hasScore || state.saving || !hasBlock;
    }

    function confirmDiscard() {
      return !(state.blockDirty || state.macroDirty) || window.confirm("Discard unsaved structure edits?");
    }

    function closeEvents() {
      state.eventSource?.close();
      state.eventSource = undefined;
      state.client?.close();
      state.playbackRequest?.abort();
      state.playbackRequest = undefined;
      window.clearInterval(state.playbackPollTimer);
      state.playbackPollTimer = undefined;
      if (state.wiperFrame !== undefined) {
        window.cancelAnimationFrame(state.wiperFrame);
        state.wiperFrame = undefined;
      }
      wiperEstimator.clear();
      state.playbackGeneration = 0;
      stopMacroPlaybackTimer();
    }

    function initScaleRoots() {
      noteNames.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = name;
        els.scaleRoot.append(option);
      });
    }

    function serverCandidates() {
      const values = [
        els.server.value,
        els.serverSelect.value,
        window.location.origin,
        "http://pt5.local:8790",
        "http://pt4.local:8790",
        "http://shadowbox.local:8790",
        "http://127.0.0.1:8790"
      ].map(normalizeServerUrl).filter(Boolean);
      return [...new Set(values)];
    }

    function currentServerUrl() {
      return normalizeServerUrl(els.server.value) || normalizeServerUrl(els.serverSelect.value) || normalizeServerUrl(window.location.origin);
    }

    function normalizeServerUrl(url) {
      return String(url ?? "").trim().replace(/\/+$/, "");
    }

    async function fetchJson(url, timeoutMs, options = {}) {
      const controller = new AbortController();
      const timer = timeoutMs ? window.setTimeout(() => controller.abort(), timeoutMs) : undefined;
      try {
        const response = await fetch(url, {
          method: options.method ?? "GET",
          headers: options.body ? { "content-type": "application/json" } : undefined,
          body: options.body ? JSON.stringify(options.body) : undefined,
          signal: controller.signal
        });
        if (!response.ok) {
          throw await responseError(response);
        }
        return await response.json();
      } finally {
        if (timer) {
          window.clearTimeout(timer);
        }
      }
    }

    async function responseError(response) {
      try {
        const payload = await response.clone().json();
        if (payload?.error) {
          return new Error(payload.error);
        }
      } catch {
        // Fall back to the HTTP status below when the server did not return JSON.
      }
      return new Error(`${response.status} ${response.statusText}`);
    }

    function isStaleScoreError(error) {
      return /stale score version \d+; current version is \d+/.test(error?.message ?? "");
    }

    function serverLabel(url, session) {
      const name = session?.server?.advertisedName || session?.server?.hostIdentity || session?.ensembleId || "ShadowScore";
      return `${name} (${url})`;
    }

    function normalizeId(value) {
      return String(value ?? "").trim();
    }

    function numberValue(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function naturalCompare(a, b) {
      return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
    }

    function cssEscape(value) {
      if (window.CSS?.escape) {
        return window.CSS.escape(value);
      }
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function setStatus(message) {
      els.status.textContent = message;
    }
  </script>
</body>
</html>
