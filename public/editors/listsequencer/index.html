<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ListSequencer Editor</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <script type="module" src="/shared/shadowscore-nav.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      display: grid;
      gap: 12px;
      margin: 0 auto;
      padding: 16px 0 32px;
      width: min(960px, calc(100vw - 28px));
    }

    .top {
      align-items: center;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      width: 100%;
    }

    h1,
    h2 {
      line-height: 1.1;
      margin: 0;
    }

    h1 {
      font-size: 18px;
    }

    h2 {
      font-size: 14px;
    }

    .subtitle,
    .status,
    .meta,
    .empty-state {
      color: var(--ss-muted);
      font-size: 12px;
      font-weight: 750;
    }

    .subtitle {
      margin: 4px 0 0;
    }

    .status {
      max-width: 46vw;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar,
    .snapshot-panel,
    .targets,
    .panel,
    .text-row,
    .ttid-card {
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
    }

    .toolbar {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      padding: 10px;
    }

    .snapshot-panel {
      background: color-mix(in srgb, var(--ss-panel) 88%, var(--ss-accent-secondary));
      border: 1px solid var(--ss-border-strong);
      border-radius: var(--ss-radius-ui);
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .snapshot-head,
    .snapshot-actions,
    .snapshot-status {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
    }

    .snapshot-fields {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    .snapshot-field {
      display: grid;
      gap: 4px;
    }

    .snapshot-field > span,
    .snapshot-ignore {
      color: var(--ss-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .snapshot-state {
      color: var(--ss-accent);
      font-weight: 850;
    }

    .toolbar-actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .readback-controls {
      align-items: center;
      display: flex;
      gap: 6px;
    }

    .readback-controls label {
      color: var(--ss-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .targets {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      padding: 10px;
    }

    .target-card {
      align-items: start;
      background: var(--ss-surface);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-control);
      display: grid;
      gap: 3px 8px;
      grid-template-columns: auto 1fr;
      padding: 8px;
    }

    .target-card input {
      grid-row: 1 / span 2;
      margin: 2px 0 0;
    }

    .target-name,
    .control-name {
      color: var(--ss-text);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .target-detail,
    .control-detail {
      color: var(--ss-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .panel {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .text-row {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(150px, 0.8fr) minmax(180px, 1.6fr) auto;
      padding: 10px;
    }

    .text-row input[type="text"] {
      min-height: 34px;
      min-width: 0;
      width: 100%;
    }

    .list-actions {
      align-items: center;
      display: flex;
      gap: 6px;
    }

    .rotate-button {
      min-width: 36px;
      padding-inline: 9px;
    }

    .number-object {
      background: var(--ss-surface);
      border: 1px solid var(--ss-border-strong);
      border-radius: var(--ss-radius-control);
      color: var(--ss-text);
      cursor: ns-resize;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-weight: 850;
      min-height: 34px;
      padding: 5px 8px;
      text-align: right;
      touch-action: none;
      user-select: none;
      width: 92px;
    }

    .number-object:focus {
      border-color: var(--ss-accent-secondary);
      outline: 2px solid color-mix(in srgb, var(--ss-accent-secondary) 28%, transparent);
      outline-offset: 1px;
      user-select: text;
    }

    .number-object[data-dragging="true"] {
      background: var(--ss-accent-secondary);
      border-color: var(--ss-accent-secondary);
      color: #061015;
    }

    .ttid-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .ttid-card {
      display: grid;
      gap: 9px;
      padding: 10px;
    }

    .ttid-head {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .readout {
      color: var(--ss-accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 850;
      text-align: right;
    }

    .keyboard {
      height: 86px;
      min-height: 86px;
      position: relative;
      width: 100%;
    }

    .key {
      align-items: end;
      background: transparent;
      border: 1px solid rgba(184, 210, 224, 0.42);
      border-radius: 0 0 5px 5px;
      box-shadow: inset 0 0 0 1px rgba(10, 16, 23, 0.62);
      clip-path: var(--key-shape);
      color: var(--ss-text);
      display: flex;
      font-size: 10px;
      font-weight: 850;
      justify-content: center;
      left: var(--key-left);
      min-height: 0;
      padding: 5px 2px;
      position: absolute;
      top: 0;
      width: var(--key-width);
    }

    .key.white {
      height: 100%;
      z-index: 1;
    }

    .key.black {
      border-radius: 0 0 4px 4px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      height: 58%;
      z-index: 2;
    }

    .key[data-active="true"] {
      background: var(--ss-accent-strong);
      border-color: rgba(7, 17, 10, 0.92);
      color: #07110a;
    }

    .scale-row {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(130px, 1fr) minmax(150px, 1fr) auto;
    }

    .root-number {
      width: 100%;
    }

    .empty-state {
      border: 1px dashed var(--ss-border-strong);
      border-radius: var(--ss-radius-ui);
      padding: 12px;
    }

    @media (max-width: 720px) {
      main {
        width: min(100vw - 24px, 960px);
      }

      .top,
      .toolbar,
      .ttid-head,
      .snapshot-head,
      .snapshot-actions,
      .snapshot-status,
      .readback-controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        max-width: none;
        text-align: left;
        white-space: normal;
      }

      .text-row,
      .snapshot-fields,
      .scale-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="ss-top-strip">
    <div class="top">
      <div>
        <h1>ListSequencer Editor</h1>
        <p class="subtitle">Message inports and compact TTID scale control</p>
      </div>
      <div id="status" class="status" role="status">Loading ListSequencer targets...</div>
    </div>
  </header>
  <nav class="ss-route-tabs" aria-label="ShadowScore navigation" data-shadow-nav>
    <a href="/piano-roll">ShadowScore</a>
    <a href="/structure-editor">Arrange</a>
    <a href="/editors" aria-current="page">OSC</a>
    <a href="/">Setup</a>
  </nav>
  <main>
    <section class="toolbar" aria-label="ListSequencer controls">
      <div class="meta"><strong>Immediate write targets:</strong> send data to checked instances</div>
      <div class="toolbar-actions">
        <div class="readback-controls">
          <label for="read-source">Instance focus</label>
          <select id="read-source" aria-label="Instance focus"></select>
        </div>
        <button id="refresh" type="button">Refresh</button>
        <button id="select-all" type="button">All Targets</button>
      </div>
    </section>
    <section id="inports" class="panel" aria-live="polite"></section>
    <section id="ttid" class="ttid-grid" aria-live="polite"></section>
    <div id="snapshot-mount"></div>
    <section class="ss-osc-live-target-panel"><div class="ss-osc-live-target-head"><h2>Live And Save Destinations</h2><span>Checked instances receive live control changes and the saved Block State.</span></div><div id="targets" class="targets" aria-label="OSC targets"></div></section>
  </main>
  <script type="module">
    import { createOscEditorSnapshot, createOscSnapshotEditorClient, mountOscSnapshotPanel, oscEditorParamValue, readOscQueryParameterValues } from "/shared/osc-snapshot-editor.js?v=20260806-block-swing1";
    const ROOTS = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
    const WHITE_PCS = new Set([0, 2, 4, 5, 7, 9, 11]);
    let SCALES = Object.freeze({ ionian: [0, 2, 4, 5, 7, 9, 11] });
    const INPORT_SPECS = Object.freeze([
      { name: "Steps", label: "Steps (0/1)" },
      { name: "StepsSecondary", label: "Secondary Steps (0/1)" },
      { name: "PrimaryRotation", label: "Primary Rotation (-60 60)" },
      { name: "SecondaryRotation", label: "Secondary Rotation (-60 60)" },
      { name: "Oct", label: "Octave" },
      { name: "Velocity", label: "Velocity (0-127)" },
      { name: "Duration", label: "Duration (ticks)" }
    ]);
    const PARAM_LABELS = Object.freeze({
      arbbeats: "Arb Beats",
      clock: "Clock",
      clockrate: "Clock Mode"
    });
    const MOMENTARY_INPORT_NAMES = new Set(["get", "panic", "probe", "reset", "rtz", "setstage"]);
    const TRANSPOSE_NAMES = new Set(["chromatictranspose", "scalartranspose", "chromatic", "scalar"]);

    const targetsEl = document.querySelector("#targets");
    const inportsEl = document.querySelector("#inports");
    const ttidEl = document.querySelector("#ttid");
    const statusEl = document.querySelector("#status");
    const refreshButton = document.querySelector("#refresh");
    const selectAllButton = document.querySelector("#select-all");
    const readSourceSelect = document.querySelector("#read-source");
    let targets = [];
    let inputPorts = [];
    let transposeParams = [];
    let genericParams = [];
    let rootParams = [];
    let ttidParams = [];
    let ttidState = new Map();
    let scaleState = new Map();
    let inputPortState = new Map();
    let snapshotClient;

    refreshButton.addEventListener("click", () => refresh({ hydrate: true }).catch(reportError));
    selectAllButton.addEventListener("click", selectAllTargets);
    const snapshotElements = mountOscSnapshotPanel(document.querySelector("#snapshot-mount"), { sourceSelect: readSourceSelect });
    snapshotClient = createOscSnapshotEditorClient({
      app: "listsequencer",
      roleLabel: "ListSequencer",
      elements: snapshotElements,
      serializeState: serializeSnapshotState,
      displayState: displaySavedState,
      onBlockChange: hydrateBlockSwing,
      onFocusChange: populateFields,
      readOnBlockChange: true,
      liveTargetRoot: targetsEl,
      setStatus
    });

    Promise.all([loadScales(), snapshotClient.init()]).then(refresh).catch(reportError);

    async function loadScales() {
      const body = await fetchJson("/harmonic/scales");
      SCALES = Object.freeze(body.scales || {});
    }

    async function refresh({ hydrate = false } = {}) {
      refreshButton.disabled = true;
      try {
        const body = await fetchJson("/osc/targets?app=listsequencer&status=online");
        targets = body.targets || [];
        inputPorts = collectInputPorts(targets);
        transposeParams = collectTransposeParams(targets);
        rootParams = collectNamedParams(targets, new Set(["root"]));
        ttidParams = collectTtidParams(targets);
        genericParams = collectGenericParams(targets);
        ttidState = mergeTtidState(ttidParams);
        renderTargets();
        renderReadSources();
        renderInports();
        renderTtid();
        hydrateBlockTtid();
        if (hydrate && targets.length) await populateFields();
        else setStatus(targets.length ? `${targets.length} target${targets.length === 1 ? "" : "s"} online` : "No online ListSequencer targets");
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        cache: "no-store",
        ...options,
        headers: {
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...(options.headers ?? {})
        }
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.ok === false) {
        throw new Error(body.error || `${url}: ${response.status} ${response.statusText}`);
      }
      return body;
    }

    function serializeSnapshotState() {
      const source = targets.find((target) => target.id === readSourceSelect.value) || targets[0];
      const byParamName = new Map((source?.parameters || []).map((param) => [param.name, param]));
      const paramEntries = Array.from(document.querySelectorAll("[data-param]"))
        .filter((control) => control.dataset.param)
        .map((control) => ({
          name: control.dataset.param,
          value: control.type === "checkbox" ? (control.checked ? 1 : 0) : control.value,
          values: byParamName.get(control.dataset.param)?.values,
          meta: byParamName.get(control.dataset.param)?.meta
        }));
      const byInputPortName = new Map(inputPorts.map((entry) => [entry.name, entry]));
      const inputPortEntries = Array.from(document.querySelectorAll("[data-inport]"))
        .filter((control) => control.dataset.inport)
        .map((control) => ({
          name: control.dataset.inport,
          value: control.value,
          meta: byInputPortName.get(control.dataset.inport)?.meta
        }));
      return createOscEditorSnapshot({ app: "listsequencer", paramEntries, inputPortEntries });
    }

    async function displaySavedState(snapshot) {
      for (const target of targets) {
        target.parameters = (target.parameters ?? []).map((param) => Object.hasOwn(snapshot.params ?? {}, param.name)
          ? { ...param, value: oscEditorParamValue(param, snapshot.params[param.name]) }
          : param);
      }
      transposeParams = collectTransposeParams(targets);
      rootParams = collectNamedParams(targets, new Set(["root"]));
      ttidParams = collectTtidParams(targets);
      genericParams = collectGenericParams(targets);
      inputPortState = new Map(Object.entries(snapshot.inputPorts ?? {}).map(([name, values]) => [name, values.join(" ")]));
      renderInports();
      renderTtid();
    }

    function collectInputPorts(nextTargets) {
      const byName = new Map();
      for (const target of nextTargets) {
        for (const inputPort of target.inputPorts || []) {
          if (!byName.has(inputPort.name)) byName.set(inputPort.name, { ...inputPort, targetIds: [] });
          byName.get(inputPort.name).targetIds.push(target.id);
        }
      }
      return Array.from(byName.values()).sort((a, b) => inportOrder(a.name) - inportOrder(b.name) || (a.index ?? 9999) - (b.index ?? 9999) || a.name.localeCompare(b.name));
    }

    function collectTransposeParams(nextTargets) {
      return collectNamedParams(nextTargets, TRANSPOSE_NAMES)
        .sort((a, b) => transposeOrder(a.name) - transposeOrder(b.name));
    }

    function collectNamedParams(nextTargets, acceptedNames) {
      const byName = new Map();
      for (const target of nextTargets) {
        for (const param of target.parameters || []) {
          if (!acceptedNames.has(normalizedName(param.name))) continue;
          if (!byName.has(param.name)) byName.set(param.name, { ...param, targetIds: [] });
          byName.get(param.name).targetIds.push(target.id);
        }
      }
      return Array.from(byName.values());
    }

    function collectTtidParams(nextTargets) {
      const byName = new Map();
      for (const target of nextTargets) {
        for (const param of target.parameters || []) {
          if (String(param.meta?.editor || "").trim().toLowerCase() !== "ttid") continue;
          if (!byName.has(param.name)) byName.set(param.name, { ...param, targetIds: [] });
          byName.get(param.name).targetIds.push(target.id);
        }
      }
      return Array.from(byName.values()).sort((a, b) => (a.index ?? 9999) - (b.index ?? 9999) || a.name.localeCompare(b.name));
    }

    function collectGenericParams(nextTargets) {
      const specializedNames = new Set([
        ...TRANSPOSE_NAMES,
        "root",
        ...collectTtidParams(nextTargets).map((param) => normalizedName(param.name))
      ]);
      const byName = new Map();
      for (const target of nextTargets) {
        for (const param of target.parameters || []) {
          if (specializedNames.has(normalizedName(param.name))) continue;
          if (!byName.has(param.name)) byName.set(param.name, { ...param, targetIds: [] });
          byName.get(param.name).targetIds.push(target.id);
        }
      }
      return Array.from(byName.values()).sort((a, b) => (a.index ?? 9999) - (b.index ?? 9999) || a.name.localeCompare(b.name));
    }

    function mergeTtidState(nextParams) {
      const next = new Map();
      for (const param of nextParams) {
        const old = ttidState.get(param.name);
        next.set(param.name, normalizeMask(old ?? param.value ?? 0));
      }
      return next;
    }

    function renderTargets() {
      const selected = new Set(Array.from(targetsEl.querySelectorAll("[data-target]:checked"), input => input.dataset.target));
      const focusedId = readSourceSelect.value || targets[0]?.id || "";
      const preserveSelection = targets.some(target => selected.has(target.id));
      const cards = targets.map((target) => {
        const label = document.createElement("label");
        label.className = "target-card";
        label.innerHTML = `
          <input type="checkbox" data-target="${escapeHtml(target.id)}">
          <span class="target-name">${escapeHtml(target.label || target.id)}</span>
          <span class="target-detail">${escapeHtml(target.unitId || "")} ${escapeHtml(target.baseAddress || "")}</span>
        `;
        label.querySelector("input").checked = preserveSelection ? selected.has(target.id) : target.id === focusedId;
        return label;
      });
      targetsEl.replaceChildren(...cards);
      if (!cards.length) targetsEl.innerHTML = `<div class="empty-state">No online ListSequencer targets.</div>`;
    }

    function renderReadSources() {
      const previous = readSourceSelect.value;
      const options = targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = `${target.label || target.id}${target.unitId ? ` (${target.unitId})` : ""}`;
        return option;
      });
      readSourceSelect.replaceChildren(...options);
      if (targets.some((target) => target.id === previous)) readSourceSelect.value = previous;
      const disabled = targets.length === 0;
      readSourceSelect.disabled = disabled;
    }

    function renderInports() {
      for (const input of inportsEl.querySelectorAll("[data-inport]")) {
        inputPortState.set(input.dataset.inport, input.value);
      }
      const rows = [
        ...inputPorts.map((inputPort) => isMomentaryInputPort(inputPort) ? renderActionInputPort(inputPort) : renderInputPort(inputPort)),
        ...transposeParams.map(renderTransposeParam),
        ...genericParams.map(renderGenericParam)
      ];
      inportsEl.replaceChildren(...rows);
      if (!rows.length) inportsEl.innerHTML = `<div class="empty-state">No ListSequencer message inports reported.</div>`;
    }

    function renderInputPort(inputPort) {
      const row = document.createElement("article");
      row.className = "text-row";
      const inputId = `input-${cssToken(inputPort.name)}`;
      row.innerHTML = `
        <div>
          <div class="control-name">${escapeHtml(labelFor(inputPort))}</div>
          <div class="control-detail">${escapeHtml(inputPort.name)} · ${inputPort.targetIds.length}</div>
        </div>
        <input id="${inputId}" type="text" autocomplete="off" spellcheck="false" value="${escapeHtml(inputPortState.get(inputPort.name) || "")}" data-inport="${escapeHtml(inputPort.name)}">
        <div class="list-actions" aria-label="${escapeHtml(labelFor(inputPort))} rotation and send controls">
          <button class="rotate-button" type="button" data-rotate="left" aria-label="Rotate ${escapeHtml(labelFor(inputPort))} left" title="Rotate left">&larr;</button>
          <button class="rotate-button" type="button" data-rotate="right" aria-label="Rotate ${escapeHtml(labelFor(inputPort))} right" title="Rotate right">&rarr;</button>
          <button type="button" data-send>Send</button>
        </div>
      `;
      const input = row.querySelector("input");
      row.querySelector("[data-send]").addEventListener("click", () => sendAddress(inputPort, parseArgs(input.value)));
      for (const button of row.querySelectorAll("[data-rotate]")) {
        button.addEventListener("click", () => rotateInputPort(inputPort, input, button.dataset.rotate).catch(reportError));
      }
      input.addEventListener("input", () => inputPortState.set(inputPort.name, input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          sendAddress(inputPort, parseArgs(input.value));
        }
      });
      return row;
    }

    async function rotateInputPort(inputPort, input, direction) {
      const values = parseArgs(input.value);
      if (!values.length) throw new Error(`Enter at least one ${labelFor(inputPort)} value to rotate`);
      const rotated = rotateList(values, direction);
      input.value = rotated.join(" ");
      inputPortState.set(inputPort.name, input.value);
      await sendAddress(inputPort, rotated);
    }

    function renderActionInputPort(inputPort) {
      const row = document.createElement("article");
      row.className = "text-row";
      row.innerHTML = `
        <div>
          <div class="control-name">${escapeHtml(actionLabel(inputPort.name))}</div>
          <div class="control-detail">${escapeHtml(inputPort.name)} · momentary · ${inputPort.targetIds.length}</div>
        </div>
        <span class="meta">Triggers immediately on checked instances</span>
        <button type="button">Trigger</button>
      `;
      row.querySelector("button").addEventListener("click", () => sendAddress(inputPort, [1]).catch(reportError));
      return row;
    }

    function renderTransposeParam(param) {
      const row = document.createElement("article");
      row.className = "text-row";
      const range = rangeText(param);
      row.innerHTML = `
        <div>
          <div class="control-name">${escapeHtml(transposeLabel(param.name))}${range ? ` (${escapeHtml(range)})` : ""}</div>
          <div class="control-detail">${escapeHtml(param.name)} · ${param.targetIds.length}</div>
        </div>
      `;
      const number = createNumberObject({
        value: param.value ?? 0,
        min: param.min,
        max: param.max,
        className: "number-object",
        label: transposeLabel(param.name),
        onChange: (value, commit) => sendParam(param, value, { commit }).catch(reportError)
      });
      number.dataset.param = param.name;
      row.append(number, document.createElement("span"));
      return row;
    }

    function renderGenericParam(param) {
      const row = document.createElement("article");
      row.className = "text-row";
      const range = rangeText(param);
      row.innerHTML = `
        <div>
          <div class="control-name">${escapeHtml(paramLabel(param.name, param.displayName))}${range ? ` (${escapeHtml(range)})` : ""}</div>
          <div class="control-detail">${escapeHtml(param.name)} · ${param.targetIds.length}</div>
        </div>
      `;

      if (Array.isArray(param.values) && param.values.length) {
        const select = document.createElement("select");
        for (const value of param.values) {
          const option = document.createElement("option");
          option.value = String(value);
          option.textContent = String(value);
          select.append(option);
        }
        select.value = String(param.value ?? param.values[0]);
        select.dataset.param = param.name;
        select.addEventListener("change", () => sendParam(param, select.value).catch(reportError));
        row.append(select, document.createElement("span"));
        return row;
      }

      if (isToggleParam(param)) {
        const label = document.createElement("label");
        label.className = "meta";
        const toggle = document.createElement("input");
        toggle.type = "checkbox";
        toggle.checked = Boolean(Number(param.value));
        toggle.dataset.param = param.name;
        toggle.addEventListener("change", () => sendParam(param, toggle.checked ? 1 : 0).catch(reportError));
        label.append(toggle, document.createTextNode(" Enabled"));
        row.append(label, document.createElement("span"));
        return row;
      }

      const input = document.createElement("input");
      const send = document.createElement("button");
      send.type = "button";
      send.textContent = "Send";
      if (isNumericParam(param)) {
        input.type = "number";
        input.value = String(param.value ?? 0);
        input.step = String(parameterStep(param));
        if (isReportedNumber(param.min)) input.min = String(param.min);
        if (isReportedNumber(param.max)) input.max = String(param.max);
      } else {
        input.type = "text";
        input.value = String(param.value ?? "");
      }
      input.dataset.param = param.name;
      const commit = () => sendParam(param, isNumericParam(param) ? Number(input.value) : input.value).catch(reportError);
      send.addEventListener("click", commit);
      input.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        commit();
      });
      row.append(input, send);
      return row;
    }

    function renderTtid() {
      const cards = ttidParams.map(renderTtidParam);
      ttidEl.replaceChildren(...cards);
      if (!cards.length) ttidEl.innerHTML = `<div class="empty-state">No compact TTID parameter reported.</div>`;
    }

    function renderTtidParam(param) {
      const card = document.createElement("article");
      card.className = "ttid-card";
      const mask = valueFor(param);
      const scale = scaleFor(param.name);
      const rootParam = rootParams[0];
      if (rootParam && !scale.initialized) {
        scale.root = clampInteger(rootParam.value, rootParam.min, rootParam.max);
        scale.initialized = true;
      }
      const head = document.createElement("div");
      head.className = "ttid-head";
      head.innerHTML = `
        <div>
          <h2 class="control-name">${escapeHtml(labelFor(param))}</h2>
          <div class="control-detail">${escapeHtml(param.name)} · ${param.targetIds.length}</div>
        </div>
        <output class="readout">${formatMask(mask)}</output>
      `;

      const keyboard = document.createElement("div");
      keyboard.className = "keyboard";
      keyboard.replaceChildren(...ROOTS.map((name, pc) => renderKey(param, pc, name, mask)));

      const rootNumber = createNumberObject({
        value: scale.root,
        min: rootParam?.min,
        max: rootParam?.max,
        className: "number-object root-number",
        label: rootParam ? `Root (${rangeText(rootParam)})` : "Root",
        onChange: (value, commit) => {
          scale.root = value;
          if (rootParam) sendParam(rootParam, value, { commit }).catch(reportError);
        }
      });
      if (rootParam) rootNumber.dataset.param = rootParam.name;

      const select = document.createElement("select");
      for (const name of Object.keys(SCALES).sort((a, b) => a.localeCompare(b))) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.append(option);
      }
      select.value = scale.name;
      select.addEventListener("change", () => {
        scale.name = select.value;
        renderTtid();
      });

      const load = document.createElement("button");
      load.className = "primary";
      load.type = "button";
      load.textContent = "Load";
      load.addEventListener("click", () => setMask(param, encodeScale(scale.root, scale.name)));

      const row = document.createElement("div");
      row.className = "scale-row";
      row.replaceChildren(wrapControl(rootParam && rangeText(rootParam) ? `Root (${rangeText(rootParam)})` : "Root", rootNumber), wrapControl("Scale", select), load);
      const snapshotValue = document.createElement("input");
      snapshotValue.type = "hidden";
      snapshotValue.dataset.param = param.name;
      snapshotValue.value = String(mask);
      card.replaceChildren(head, keyboard, row, snapshotValue);
      return card;
    }

    function renderKey(param, pc, name, mask) {
      const button = document.createElement("button");
      button.className = `key ${WHITE_PCS.has(pc) ? "white" : "black"}`;
      button.type = "button";
      button.textContent = name;
      button.dataset.active = String(isPcOn(mask, pc));
      const geometry = keyGeometry(pc);
      button.style.setProperty("--key-left", geometry.left);
      button.style.setProperty("--key-width", geometry.width);
      button.style.setProperty("--key-shape", geometry.shape);
      button.addEventListener("click", () => setMask(param, togglePc(valueFor(param), pc)));
      return button;
    }

    function keyGeometry(pc) {
      const whitePcs = [0, 2, 4, 5, 7, 9, 11];
      const whiteWidth = 100 / 7;
      const whiteIndex = whitePcs.indexOf(pc);
      if (whiteIndex >= 0) {
        return { left: `${whiteIndex * whiteWidth}%`, width: `${whiteWidth}%`, shape: whiteKeyShape(pc) };
      }
      const blackAnchors = new Map([[1, 1], [3, 2], [6, 4], [8, 5], [10, 6]]);
      const blackWidth = whiteWidth * 0.58;
      const anchor = blackAnchors.get(pc) ?? 0;
      return { left: `${(anchor * whiteWidth) - (blackWidth / 2)}%`, width: `${blackWidth}%`, shape: "polygon(0 0, 100% 0, 100% 100%, 0 100%)" };
    }

    function whiteKeyShape(pc) {
      if ([0, 5].includes(pc)) return "polygon(0 0, 70% 0, 70% 58%, 100% 58%, 100% 100%, 0 100%)";
      if ([2, 7, 9].includes(pc)) return "polygon(25% 0, 75% 0, 75% 58%, 100% 58%, 100% 100%, 0 100%, 0 58%, 25% 58%)";
      return "polygon(30% 0, 100% 0, 100% 100%, 0 100%, 0 58%, 30% 58%)";
    }

    async function sendAddress(inputPort, args) {
      snapshotClient?.commitEdit();
      const selected = selectedTargetsFor(inputPort.targetIds);
      if (!selected.length) {
        setStatus("No targets selected");
        return;
      }
      const body = await postOsc({ targets: selected, inputPort: inputPort.name, args });
      const sent = (body.results || []).filter((result) => result.ok).length;
      setStatus(`Sent ${labelFor(inputPort)} to ${sent}/${selected.length}`);
    }

    async function populateFields() {
      const target = targets.find((entry) => entry.id === readSourceSelect.value);
      if (!target) {
        setStatus("Choose an instance to get data from");
        return;
      }
      const availableNames = new Set((target.inputPorts || []).map((entry) => entry.name));
      const fields = inputPorts.filter((inputPort) => !isMomentaryInputPort(inputPort) && availableNames.has(inputPort.name));

      setStatus(`Getting parameters and ${fields.length} OSC field${fields.length === 1 ? "" : "s"} from ${target.label || target.id}...`);
      const populatedParams = await hydrateParameters(target);
      const requests = await Promise.allSettled(fields.map((inputPort) => postOsc({
        targets: [target.id],
        inputPort: inputPort.name,
        args: [-999]
      })));
      await delay(75);
      const reads = await Promise.allSettled(fields.map((inputPort) => readAck(target, inputPort.name)));
      let populated = 0;
      for (let index = 0; index < fields.length; index += 1) {
        if (requests[index].status !== "fulfilled" || reads[index].status !== "fulfilled") continue;
        const input = inportsEl.querySelector(`[data-inport="${cssSelectorValue(fields[index].name)}"]`);
        if (!input) continue;
        input.value = formatAckValue(reads[index].value);
        inputPortState.set(fields[index].name, input.value);
        populated += 1;
      }
      const failed = fields.length - populated;
      setStatus(`Got ${populatedParams} parameter${populatedParams === 1 ? "" : "s"} and ${populated}/${fields.length} OSC field${fields.length === 1 ? "" : "s"} from ${target.label || target.id}${failed ? `; ${failed} ACK${failed === 1 ? "" : "s"} unavailable` : ""}`);
    }

    async function hydrateParameters(target) {
      const values = await readOscQueryParameterValues(target);
      let populated = 0;
      target.parameters = (target.parameters || []).map((param) => {
        if (!values.has(param.name)) return param;
        if (String(param.meta?.editor || "").trim().toLowerCase() === "ttid") return param;
        populated += 1;
        return { ...param, value: values.get(param.name) };
      });
      const orderedTargets = [target, ...targets.filter((entry) => entry.id !== target.id)];
      transposeParams = collectTransposeParams(orderedTargets);
      rootParams = collectNamedParams(orderedTargets, new Set(["root"]));
      ttidParams = collectTtidParams(orderedTargets);
      genericParams = collectGenericParams(orderedTargets);
      ttidState = new Map();
      scaleState = new Map();
      ttidState = mergeTtidState(ttidParams);
      renderInports();
      renderTtid();
      hydrateBlockTtid();
      return populated;
    }

    function oscQueryHost(target) {
      return isLoopback(target.host) ? location.hostname : target.host;
    }

    async function readAck(target, inputPortName) {
      const host = isLoopback(target.host) ? location.hostname : target.host;
      const path = `${target.baseAddress}/messages/out/${encodeURIComponent(inputPortName)}Ack`;
      const response = await fetch(`${location.protocol}//${host}:5678${path}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`${inputPortName}Ack: ${response.status}`);
      const body = await response.json();
      return body.VALUE;
    }

    function formatAckValue(value) {
      const values = Array.isArray(value) ? value : [value];
      return values.filter((entry) => entry !== undefined && entry !== null).map(String).join(" ");
    }

    function delay(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    async function setMask(param, mask) {
      const value = normalizeMask(mask);
      ttidState.set(param.name, value);
      renderTtid();
      const selected = selectedTargetsFor(param.targetIds);
      const state = snapshotClient?.snapshotState();
      if (!state?.blockId) throw new Error("Choose an EDITING block");
      const body = await fetchJson(`/mesostructure/${encodeURIComponent(state.blockId)}/ttid`, {
        method: "PUT",
        body: JSON.stringify({ ttid: value, expectedScoreRevision: state.score?.scoreRevision, auditionTargets: selected })
      });
      snapshotClient?.syncScore(body.score);
      setStatus(`Updated ${state.blockId} TTID to ${formatMask(value)}${selected.length ? ` and auditioned ${selected.length} target${selected.length === 1 ? "" : "s"}` : ""}`);
      hydrateBlockTtid(body.score);
    }

    function hydrateBlockTtid(scoreOverride) {
      const state = snapshotClient?.snapshotState();
      const block = (scoreOverride || state?.score)?.mesostructure?.[state?.blockId];
      if (!block) return;
      for (const param of ttidParams) ttidState.set(param.name, normalizeMask(block.ttid));
      renderTtid();
    }

    async function sendParam(param, value, { commit = true } = {}) {
      if (isBlockSwingParam(param)) return updateBlockSwing(param, value);
      if (commit) snapshotClient?.commitEdit();
      const selected = selectedTargetsFor(param.targetIds);
      if (!selected.length) {
        setStatus("No targets selected");
        return;
      }
      const body = await postOsc({ targets: selected, param: param.name, args: [value] });
      const sent = (body.results || []).filter((result) => result.ok).length;
      setStatus(`Sent ${paramLabel(param.name, param.displayName)} ${value} to ${sent}/${selected.length}`);
    }

    async function updateBlockSwing(param, value) {
      const state = snapshotClient?.snapshotState();
      const block = state?.score?.mesostructure?.[state.blockId];
      if (!block) throw new Error("Choose an EDITING block");
      const name = normalizeSwingName(param.name);
      const result = await snapshotClient.updateBlockSwing({
        swing: name === "swing" ? value : block.swing,
        swingAmt: name === "swingamt" ? value : block.swingAmt
      });
      hydrateBlockSwing(result.score.mesostructure[result.blockId]);
      setStatus(`Updated ${result.blockId} Swing for ${result.distribution.succeededCount}/${result.distribution.attemptedCount} sequencers`);
    }

    function hydrateBlockSwing(block) {
      if (!block) return;
      for (const param of genericParams) {
        const name = normalizeSwingName(param.name);
        if (name === "swing") param.value = Array.isArray(param.values) ? (Number(block.swing) ? "On" : "Off") : block.swing;
        if (name === "swingamt") param.value = block.swingAmt;
      }
      renderInports();
    }

    function isBlockSwingParam(param) { return ["swing", "swingamt"].includes(normalizeSwingName(param?.name)); }
    function normalizeSwingName(value) { return String(value || "").split("/").at(-1).toLowerCase().replace(/[^a-z0-9]+/g, ""); }

    async function postOsc(payload) {
      const response = await fetch("/osc/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.ok === false) {
        throw new Error(body.error || `OSC send failed: ${response.status}`);
      }
      return body;
    }

    function selectedTargetsFor(allowedIds) {
      const allowed = new Set(allowedIds || []);
      return Array.from(document.querySelectorAll("[data-target]:checked"))
        .map((input) => input.dataset.target)
        .filter((id) => id && allowed.has(id));
    }

    function selectAllTargets() {
      for (const input of document.querySelectorAll("[data-target]")) {
        input.checked = true;
      }
    }

    function parseArgs(text) {
      const trimmed = String(text ?? "").trim();
      if (!trimmed) return [];
      return trimmed.split(/[\s,]+/g).filter(Boolean).map((part) => {
        const number = Number(part);
        return Number.isFinite(number) && part !== "" ? number : part;
      });
    }

    function rotateList(values, direction) {
      if (values.length < 2) return [...values];
      return direction === "right"
        ? [values.at(-1), ...values.slice(0, -1)]
        : [...values.slice(1), values[0]];
    }

    function isLoopback(host) {
      return !host || host === "127.0.0.1" || host === "localhost" || host === "::1";
    }

    function createNumberObject(options) {
      const input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.className = options.className || "number-object";
      input.value = String(clampInteger(options.value, options.min, options.max));
      input.setAttribute("role", "spinbutton");
      input.setAttribute("aria-label", options.label || "Number");
      if (isReportedNumber(options.min)) input.setAttribute("aria-valuemin", String(options.min));
      if (isReportedNumber(options.max)) input.setAttribute("aria-valuemax", String(options.max));
      let drag = null;

      const commit = (nextValue, save = true) => {
        const value = clampInteger(nextValue, options.min, options.max);
        input.value = String(value);
        input.setAttribute("aria-valuenow", String(value));
        options.onChange(value, save);
      };
      input.addEventListener("change", () => commit(input.value));
      input.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          event.preventDefault();
          commit(Number(input.value) + (event.key === "ArrowUp" ? 1 : -1));
        }
      });
      input.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        drag = { id: event.pointerId, y: event.clientY, value: Number(input.value), last: Number(input.value), gesture: snapshotClient?.beginGesture() ?? null };
        input.setPointerCapture(event.pointerId);
      });
      input.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const steps = Math.trunc((drag.y - event.clientY) / 8);
        const value = clampInteger(drag.value + steps, options.min, options.max);
        if (value === drag.last) return;
        drag.last = value;
        input.dataset.dragging = "true";
        commit(value, false);
      });
      const endDrag = (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        const completed = drag;
        drag = null;
        input.dataset.dragging = "false";
        if (event.type === "pointercancel") {
          if (completed.gesture) snapshotClient?.cancelGesture(completed.gesture);
        } else if (completed.gesture) {
          snapshotClient?.commitGesture(completed.gesture);
        }
      };
      input.addEventListener("pointerup", endDrag);
      input.addEventListener("pointercancel", endDrag);
      return input;
    }

    function clampInteger(value, min, max) {
      let next = Math.round(Number(value));
      if (!Number.isFinite(next)) next = 0;
      if (isReportedNumber(min)) next = Math.max(Number(min), next);
      if (isReportedNumber(max)) next = Math.min(Number(max), next);
      return next;
    }

    function normalizedName(value) {
      return String(value || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function inportOrder(name) {
      const index = INPORT_SPECS.findIndex((spec) => normalizedName(spec.name) === normalizedName(name));
      return index < 0 ? 9999 : index;
    }

    function transposeOrder(name) {
      return normalizedName(name).startsWith("chromatic") ? 0 : 1;
    }

    function transposeLabel(name) {
      return normalizedName(name).startsWith("chromatic") ? "Chromatic Transpose" : "Scalar Transpose";
    }

    function paramLabel(name, displayName = "") {
      const normalized = normalizedName(name);
      if (PARAM_LABELS[normalized]) return PARAM_LABELS[normalized];
      if (normalized === "root") return "Root";
      if (TRANSPOSE_NAMES.has(normalized)) return transposeLabel(name);
      return displayName || name;
    }

    function isMomentaryInputPort(inputPort) {
      if (inputPort.meta?.snapshot === true || inputPort.meta?.snapshot_state === true) return false;
      const normalized = normalizedName(inputPort.name);
      return MOMENTARY_INPORT_NAMES.has(normalized)
        || normalized.endsWith("probe")
        || normalized.endsWith("panic")
        || normalized.endsWith("ack");
    }

    function actionLabel(name) {
      return normalizedName(name) === "rtz" ? "Return to Zero" : (name || "Action");
    }

    function isReportedNumber(value) {
      return value !== undefined && value !== null && value !== "" && Number.isFinite(Number(value));
    }

    function isNumericParam(param) {
      return ["f", "i", "d"].includes(String(param.type || "").toLowerCase()) || typeof param.value === "number";
    }

    function isToggleParam(param) {
      return isNumericParam(param) && Number(param.min) === 0 && Number(param.max) === 1;
    }

    function parameterStep(param) {
      if (param.meta?.edit_as === "int") return 1;
      const span = Number(param.max) - Number(param.min);
      if (!Number.isFinite(span)) return "any";
      return span <= 1 ? 0.01 : span <= 100 ? 0.1 : 1;
    }

    function rangeText(param) {
      return isReportedNumber(param.min) && isReportedNumber(param.max) ? `${param.min} ${param.max}` : "";
    }

    function scaleFor(paramName) {
      if (!scaleState.has(paramName)) {
        scaleState.set(paramName, { root: 0, name: "ionian", initialized: false });
      }
      return scaleState.get(paramName);
    }

    function encodeScale(root, scaleName) {
      return (SCALES[scaleName] || []).reduce((mask, pc) => mask | (1 << ((Number(pc) + Number(root)) % 12)), 0) & 0xFFF;
    }

    function valueFor(param) {
      return normalizeMask(ttidState.get(param.name) ?? param.value ?? 0);
    }

    function normalizeMask(value) {
      return (Number(value) || 0) & 0xFFF;
    }

    function isPcOn(mask, pc) {
      return (normalizeMask(mask) & (1 << (pc % 12))) !== 0;
    }

    function togglePc(mask, pc) {
      return normalizeMask(mask) ^ (1 << (pc % 12));
    }

    function formatMask(mask) {
      const value = normalizeMask(mask);
      return `${value} / 0x${value.toString(16).toUpperCase().padStart(3, "0")}`;
    }

    function labelFor(control) {
      const spec = INPORT_SPECS.find((entry) => normalizedName(entry.name) === normalizedName(control.name));
      if (spec) return spec.label;
      return control.displayName || control.meta?.display_name || control.name || "Control";
    }

    function wrapControl(label, node) {
      const wrapper = document.createElement("div");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = label;
      wrapper.replaceChildren(meta, node);
      return wrapper;
    }

    function cssToken(value) {
      return String(value ?? "").replace(/[^a-zA-Z0-9_-]/g, "-");
    }

    function cssSelectorValue(value) {
      return globalThis.CSS?.escape ? CSS.escape(String(value ?? "")) : cssToken(value);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function reportError(error) {
      refreshButton.disabled = false;
      setStatus(error.message || String(error));
      inportsEl.innerHTML = `<div class="empty-state">${escapeHtml(error.message || String(error))}</div>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }
  </script>
</body>
</html>
