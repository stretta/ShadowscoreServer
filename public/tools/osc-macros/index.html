<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSC Macros</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .macro-header {
      align-items: center;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      min-height: 56px;
      padding: 10px 18px;
    }

    .macro-header h1 {
      font-size: 18px;
      margin: 0;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      color: var(--ss-muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-width: 15rem;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(240px, 0.8fr) minmax(360px, 1.2fr);
      min-height: 0;
      padding: 14px 18px 20px;
    }

    .panel {
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .macro-list {
      display: grid;
      gap: 8px;
    }

    .macro-card {
      background: var(--ss-surface);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      display: grid;
      gap: 10px;
      padding: 10px;
    }

    .macro-name {
      color: var(--ss-text);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--ss-muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .fields {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .step-builder {
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(140px, 1fr) minmax(90px, auto) minmax(80px, auto) auto;
    }

    label {
      display: grid;
      gap: 4px;
    }

    label span {
      color: var(--ss-muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 260px;
      resize: vertical;
      width: 100%;
    }

    .validation {
      display: grid;
      gap: 6px;
    }

    .validation-row {
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-control);
      display: grid;
      gap: 8px;
      grid-template-columns: auto 1fr;
      padding: 8px;
    }

    .badge {
      border-radius: 999px;
      color: #07110a;
      font-size: 11px;
      font-weight: 900;
      min-width: 42px;
      padding: 3px 7px;
      text-align: center;
      text-transform: uppercase;
    }

    .badge.ok {
      background: var(--ss-accent-strong);
    }

    .badge.fail {
      background: var(--ss-danger);
      color: #260909;
    }

    .empty-state {
      color: var(--ss-muted);
      padding: 10px 0;
    }

    @media (max-width: 860px) {
      .macro-header {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        min-width: 0;
        text-align: left;
      }

      .workspace,
      .fields,
      .step-builder {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="macro-header">
      <h1>OSC Macros</h1>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </header>
    <section class="workspace">
      <aside class="panel">
        <div id="macros" class="macro-list"></div>
      </aside>
      <section class="panel">
        <form id="editor">
          <div class="fields">
            <label><span>ID</span><input id="macro-id" autocomplete="off"></label>
            <label><span>Label</span><input id="macro-label" autocomplete="off"></label>
          </div>
          <div class="step-builder">
            <label><span>Target</span><select id="step-target"></select></label>
            <label><span>Param</span><select id="step-param"><option>VolA</option><option>VolB</option></select></label>
            <label><span>Value</span><input id="step-value" type="number" min="-70" max="0" step="1" value="0"></label>
            <button id="add-step" type="button">Add Step</button>
          </div>
          <textarea id="macro" spellcheck="false"></textarea>
          <div class="actions">
            <button type="submit" class="primary">Save</button>
            <button type="button" id="dry-run">Dry Run</button>
            <button type="button" id="run">Run</button>
          </div>
          <div id="validation" class="validation" aria-live="polite"></div>
        </form>
      </section>
    </section>
  </main>
  <script>
    const macrosEl = document.querySelector("#macros");
    const macroEl = document.querySelector("#macro");
    const macroIdEl = document.querySelector("#macro-id");
    const macroLabelEl = document.querySelector("#macro-label");
    const statusEl = document.querySelector("#status");
    const validationEl = document.querySelector("#validation");
    const stepTargetEl = document.querySelector("#step-target");
    const stepParamEl = document.querySelector("#step-param");
    const stepValueEl = document.querySelector("#step-value");
    const refreshButton = document.querySelector("#refresh");
    let macros = [];
    let targets = [];

    setMacro({
      id: "poland-vola-zero",
      label: "Poland VolA Zero",
      steps: [{ target: "wren:poland:main", param: "VolA", args: [0] }]
    });

    refreshButton.addEventListener("click", () => refresh().catch(reportError));
    document.querySelector("#add-step").addEventListener("click", addStep);
    document.querySelector("#dry-run").addEventListener("click", () => saveAndRun(true).catch(reportError));
    document.querySelector("#run").addEventListener("click", () => saveAndRun(false).catch(reportError));
    document.querySelector("#editor").addEventListener("submit", async (event) => {
      event.preventDefault();
      await saveCurrent();
      await refresh();
    });
    macroIdEl.addEventListener("input", syncHeaderToJson);
    macroLabelEl.addEventListener("input", syncHeaderToJson);

    async function refresh() {
      refreshButton.disabled = true;
      setStatus("Refreshing");
      const [macroResponse, targetResponse] = await Promise.all([
        fetch("/osc/macros"),
        fetch("/osc/targets?status=online")
      ]);
      const macroBody = await macroResponse.json();
      const targetBody = await targetResponse.json();
      macros = macroBody.macros || [];
      targets = targetBody.targets || [];
      renderMacros();
      renderTargets();
      setStatus(`${macros.length} macro${macros.length === 1 ? "" : "s"}, ${targets.length} target${targets.length === 1 ? "" : "s"}`);
      refreshButton.disabled = false;
    }

    function renderMacros() {
      const cards = macros.map((macro) => {
        const card = document.createElement("section");
        card.className = "macro-card";
        card.innerHTML = `
          <div>
            <div class="macro-name">${escapeHtml(macro.label || macro.id)}</div>
            <div class="meta">${escapeHtml(macro.id)} &middot; ${(macro.steps || []).length} step${(macro.steps || []).length === 1 ? "" : "s"}</div>
          </div>
        `;
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(
          button("Load", () => setMacro(macro)),
          button("Dry", () => runMacro(macro.id, true).catch(reportError)),
          button("Run", () => runMacro(macro.id, false).catch(reportError))
        );
        card.append(actions);
        return card;
      });
      macrosEl.replaceChildren(...cards);
      if (cards.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No saved OSC macros.";
        macrosEl.append(empty);
      }
    }

    function renderTargets() {
      const options = targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = `${target.label || target.id} (${target.unitId || target.id})`;
        return option;
      });
      stepTargetEl.replaceChildren(...options);
    }

    async function saveCurrent() {
      const macro = currentMacro();
      const response = await fetch("/osc/macros", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(macro)
      });
      const body = await response.json();
      if (!response.ok || body.ok === false) throw new Error(body.error || "Save failed");
      setMacro(body.macro);
      setStatus(`Saved ${body.macro.id}`);
      return body.macro;
    }

    async function saveAndRun(dryRun) {
      const macro = await saveCurrent();
      await refresh();
      await runMacro(macro.id, dryRun);
    }

    async function runMacro(id, dryRun) {
      setStatus(dryRun ? `Dry run ${id}` : `Run ${id}`);
      const response = await fetch(`/osc/macros/${encodeURIComponent(id)}/run`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dryRun })
      });
      const body = await response.json();
      renderValidation(body.validation || []);
      if (!response.ok || body.ok === false) {
        setStatus(body.error || `Validation failed for ${id}`);
        return;
      }
      setStatus(dryRun ? `Dry run OK: ${id}` : `Ran ${id}: ${(body.results || []).filter((result) => result.ok).length}/${(body.results || []).length}`);
    }

    function addStep() {
      const macro = currentMacro();
      const target = stepTargetEl.value;
      if (!target) {
        setStatus("No target selected");
        return;
      }
      macro.steps.push({
        target,
        param: stepParamEl.value,
        args: [Number(stepValueEl.value)]
      });
      setMacro(macro);
    }

    function currentMacro() {
      const macro = JSON.parse(macroEl.value);
      macro.id = slug(macroIdEl.value || macro.id || macro.label);
      macro.label = macroLabelEl.value || macro.label || macro.id;
      macro.steps = Array.isArray(macro.steps) ? macro.steps : [];
      return macro;
    }

    function setMacro(macro) {
      macroIdEl.value = macro.id || "";
      macroLabelEl.value = macro.label || macro.id || "";
      macroEl.value = JSON.stringify(macro, null, 2);
      validationEl.replaceChildren();
    }

    function syncHeaderToJson() {
      try {
        const macro = currentMacro();
        macroEl.value = JSON.stringify(macro, null, 2);
      } catch {
        return;
      }
    }

    function renderValidation(validation) {
      const rows = validation.map((step) => {
        const row = document.createElement("div");
        row.className = "validation-row";
        row.innerHTML = `
          <span class="badge ${step.ok ? "ok" : "fail"}">${step.ok ? "OK" : "Fail"}</span>
          <span class="meta">${escapeHtml(step.target)} ${escapeHtml(step.param || step.address || "")} ${escapeHtml(step.error || step.address || "")}</span>
        `;
        return row;
      });
      validationEl.replaceChildren(...rows);
    }

    function button(label, onClick) {
      const element = document.createElement("button");
      element.type = "button";
      element.textContent = label;
      element.addEventListener("click", onClick);
      return element;
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function reportError(error) {
      refreshButton.disabled = false;
      setStatus(error.message || String(error));
    }

    function slug(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    refresh().catch(reportError);
  </script>
</body>
</html>
