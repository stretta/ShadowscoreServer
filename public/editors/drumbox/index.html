<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drumbox OSC Editor</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <script type="module" src="/shared/shadowscore-nav.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, rgba(249,115,22,.1), transparent 220px), var(--ss-bg); }
    main { display: grid; grid-template-rows: auto 1fr auto auto; min-height: 100vh; }
    header, .actions, .target-card { align-items: center; display: flex; }
    header { gap: 16px; justify-content: space-between; min-height: 56px; padding: 10px 18px; }
    h1 { font-size: 18px; margin: 0; }
    .subtitle, .status, .target-detail, output { color: var(--ss-muted); font-size: 12px; font-weight: 700; }
    .subtitle { margin: 4px 0 0; }
    .actions { gap: 10px; }
    .status { max-width: 420px; overflow: hidden; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .targets { display: flex; gap: 8px; min-height: 58px; overflow-x: auto; padding: 8px 18px 10px; }
    .target-card { background: var(--ss-panel); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-ui); cursor: pointer; flex: 0 0 210px; gap: 9px; padding: 10px; }
    .target-copy { min-width: 0; }
    .target-name, .target-detail { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target-name { color: var(--ss-text); font-weight: 800; }
    #panels { align-content: start; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); min-height: 0; overflow: auto; padding: 14px 18px 20px; }
    .panel { --group-accent: #f97316; background: var(--ss-panel); border: 1px solid var(--ss-border); border-radius: var(--ss-radius-ui); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 32px 9px 10px; position: relative; }
    .panel::before { background: var(--group-accent); border-radius: calc(var(--ss-radius-ui) - 1px) calc(var(--ss-radius-ui) - 1px) 0 0; content: ""; height: 24px; inset: 0 0 auto; position: absolute; }
    .panel[data-group="master"] { --group-accent: #4f657a; }
    .panel[data-group="synth-kick"] { --group-accent: #dc2626; }
    .panel[data-group="synth-snare"] { --group-accent: #d97706; }
    .panel[data-group^="sample-"] { --group-accent: #7c3aed; }
    .panel[data-group="reverb"] { --group-accent: #0284a8; }
    .panel[data-group="other"] { --group-accent: #64748b; }
    .panel h2 { align-items: center; color: #fff; display: flex; font-size: 11px; font-weight: 800; height: 24px; inset: 0 0 auto; justify-content: center; letter-spacing: .08em; line-height: 1; margin: 0; position: absolute; text-align: center; text-shadow: 0 1px 0 rgba(0,0,0,.22); text-transform: uppercase; z-index: 1; }
    .controls { align-items: flex-end; display: flex; gap: 7px; justify-content: center; min-height: 166px; min-width: 0; width: 100%; }
    .control { align-items: center; display: flex; flex: 1 1 0; flex-direction: column; gap: 4px; min-width: 0; }
    .control-label { color: var(--ss-text); font-size: 10px; font-weight: 800; line-height: 1.1; max-width: 70px; min-height: 24px; overflow-wrap: anywhere; text-align: center; text-transform: uppercase; }
    .panel[data-group^="sample-"] .control-label { font-size: 9px; letter-spacing: -.02em; max-width: none; overflow-wrap: normal; white-space: nowrap; }
    .control-readout { color: var(--ss-muted); font-size: 11px; font-variant-numeric: tabular-nums; height: 14px; line-height: 14px; text-align: center; white-space: nowrap; }
    .vertical-slider { accent-color: var(--group-accent); appearance: auto; direction: rtl; height: 116px; margin: 0; width: 20px; writing-mode: vertical-lr; }
    .choice-select { margin: 46px 0; max-width: 100%; min-width: 0; width: 100%; }
    .choice-switch { align-items: center; display: flex; height: 116px; justify-content: center; position: relative; width: 28px; }
    .choice-switch input { height: 1px; opacity: 0; position: absolute; width: 1px; }
    .choice-switch-track { background: color-mix(in srgb, var(--ss-bg) 72%, #000); border: 1px solid var(--ss-border); border-radius: 12px; box-shadow: inset 0 1px 4px rgba(0,0,0,.28); cursor: pointer; height: 48px; position: relative; width: 22px; }
    .choice-switch-track::after { background: var(--group-accent); border: 1px solid rgba(255,255,255,.35); border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.4); content: ""; height: 16px; left: 2px; position: absolute; top: 3px; transition: transform 100ms ease; width: 16px; }
    .choice-switch input:checked + .choice-switch-track::after { transform: translateY(23px); }
    .choice-switch input:focus-visible + .choice-switch-track { outline: 2px solid var(--ss-focus, #38bdf8); outline-offset: 2px; }
    .choice-control .control-readout { font-size: 9px; overflow: visible; }
    output { font-variant-numeric: tabular-nums; }
    .empty { color: var(--ss-muted); padding: 28px 4px; }
    @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } .actions { align-items: flex-start; flex-wrap: wrap; } .status { max-width: none; text-align: left; white-space: normal; } #panels { grid-template-columns: 1fr; padding-inline: 12px; } }
  </style>
</head>
<body>
  <nav class="ss-route-tabs" aria-label="ShadowScore navigation" data-shadow-nav>
    <a href="/piano-roll">ShadowScore</a><a href="/structure-editor">Arrange</a>
    <a href="/editors" aria-current="page">OSC</a><a href="/">Setup</a>
  </nav>
  <main>
    <header>
      <div><h1>Drumbox Editor</h1><p class="subtitle">Kick, snare, and eight sample voices</p></div>
      <div class="actions">
        <label for="read-source">Instance focus</label>
        <select id="read-source" aria-label="Instance focus"></select>
        <button id="get-data" type="button">Read Instance</button>
        <button id="refresh" type="button">Refresh</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </header>
    <div id="panels"></div>
    <div id="snapshot-mount"></div>
    <section class="ss-osc-live-target-panel">
      <div class="ss-osc-live-target-head"><h2>Live And Save Destinations</h2><span>Checked instances receive live control changes and the saved Block State.</span></div>
      <div id="targets" class="targets" aria-label="Drumbox targets"></div>
    </section>
  </main>
  <script type="module">
    import { createOscEditorSnapshot, createOscSnapshotEditorClient, mountOscSnapshotPanel, oscEditorParamValue } from "/shared/osc-snapshot-editor.js?v=20260727-nested-keys1";

    const SAMPLE_CONTROLS = ["PlayMode", "Note", "Sample", "Transpose", "Attack", "Hold", "Release", "Level", "Pan", "AuxSend"];
    const DRUMBOX_GROUPS = [
      { title: "Master", key: "master", controls: ["Volume"] },
      { title: "Synth Kick", key: "synth-kick", prefix: "SynthDrum1/", order: ["Note", "Pitch", "PitchModEnvAmt", "PitchModEnvDecayTime", "AmpModEnvHoldTime", "AmpModEnvDecayTime", "Level", "Pan", "VelVCA"] },
      { title: "Synth Snare", key: "synth-snare", prefix: "SynthDrum2/", order: ["Note", "HPFCutoff", "AmpModEnvDecayTime", "Level", "Pan", "VelVCA", "AuxSend"] },
      ...Array.from({ length: 8 }, (_, index) => {
        const number = index + 1;
        return { title: `Sample ${number}`, key: `sample-${number}`, prefix: `Sample${number}/`, order: SAMPLE_CONTROLS };
      }),
      { title: "Plate Reverb", key: "reverb", prefix: "RnboPlateReverb/", order: ["mix", "decay", "damp", "size", "diff", "jitter"] }
    ];
    const LABELS = {
      HPFCutoff: "HPF Cutoff", VelVCA: "Velocity", AmpModEnvHoldTime: "Amp Hold", AmpModEnvDecayTime: "Amp Decay",
      PitchModEnvDecayTime: "Pitch Decay", PitchModEnvAmt: "Pitch Sweep", ReverbSend: "Reverb", AuxSend: "Aux",
      Transpose: "Tune", mix: "Mix", decay: "Decay", damp: "Damp", size: "Size", diff: "Diffusion", jitter: "Jitter"
    };

    const targetsEl = document.querySelector("#targets");
    const panelsEl = document.querySelector("#panels");
    const statusEl = document.querySelector("#status");
    const refreshButton = document.querySelector("#refresh");
    const readSourceSelect = document.querySelector("#read-source");
    const getDataButton = document.querySelector("#get-data");
    let targets = [];
    let params = new Map();
    let paramsTargetId = "";
    const pending = new Map();
    let snapshotClient;

    refreshButton.addEventListener("click", () => refresh().catch(reportError));
    getDataButton.addEventListener("click", () => getData().catch(reportError));
    const snapshotElements = mountOscSnapshotPanel(document.querySelector("#snapshot-mount"), { sourceSelect: readSourceSelect });
    snapshotClient = createOscSnapshotEditorClient({ app: "drumbox", roleLabel: "Drumbox", elements: snapshotElements, serializeState: serializeSnapshotState, displayState: displaySavedState, onFocusChange: getData, liveTargetRoot: targetsEl, setStatus });
    refresh().then(() => snapshotClient.init()).catch(reportError);

    async function refresh() {
      refreshButton.disabled = true;
      try {
        const response = await fetch("/osc/targets?app=drumbox&status=online", { cache: "no-store" });
        const body = await response.json();
        if (!response.ok || body.ok === false) throw new Error(body.error || `Request failed: ${response.status}`);
        targets = body.targets || [];
        renderReadSources();
        syncParamsToReadSource();
        renderTargets();
        renderPanels();
        setStatus(targets.length ? `${targets.length} target${targets.length === 1 ? "" : "s"} online` : "No online Drumbox targets");
      } finally {
        refreshButton.disabled = false;
      }
    }

    function paramsForTarget(target, previous = new Map()) {
      const next = new Map();
      for (const param of target?.parameters || []) {
        const key = parameterKey(param);
        if (!next.has(key)) next.set(key, { ...param, key });
      }
      for (const [key, old] of previous) if (next.has(key)) next.get(key).value = old.value;
      return next;
    }

    function syncParamsToReadSource({ preserve = true } = {}) {
      const target = readSourceTarget();
      const previous = preserve && target?.id === paramsTargetId ? params : new Map();
      params = paramsForTarget(target, previous);
      paramsTargetId = target?.id || "";
    }

    function renderTargets() {
      const selected = new Set([...targetsEl.querySelectorAll("[data-target]:checked")].map((input) => input.dataset.target));
      const focusedId = readSourceSelect.value || targets[0]?.id || "";
      const preserveSelection = targets.some((target) => selected.has(target.id));
      targetsEl.replaceChildren(...targets.map((target) => {
        const card = document.createElement("label");
        card.className = "target-card";
        card.innerHTML = `<input type="checkbox" data-target="${escapeHtml(target.id)}"><span class="target-copy"><span class="target-name">${escapeHtml(target.label || target.id)}</span><span class="target-detail">${escapeHtml(target.unitId || target.baseAddress || "")}</span></span>`;
        card.querySelector("input").checked = preserveSelection ? selected.has(target.id) : target.id === focusedId;
        return card;
      }));
    }

    function renderReadSources() {
      const previous = readSourceSelect.value;
      readSourceSelect.replaceChildren(...targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = target.label || target.id;
        return option;
      }));
      readSourceSelect.value = targets.some((target) => target.id === previous) ? previous : (newestTarget()?.id || "");
      readSourceSelect.disabled = targets.length === 0;
      getDataButton.disabled = targets.length === 0;
    }

    async function getData() {
      const target = readSourceTarget();
      if (!target) return setStatus("Choose an instance to get data from");
      syncParamsToReadSource({ preserve: false });
      renderPanels();
      getDataButton.disabled = true;
      setStatus(`Getting data from ${target.label || target.id}...`);
      try {
        const response = await fetch(`${location.protocol}//${oscQueryHost(target)}:5678${target.baseAddress}/params`, { cache: "no-store" });
        if (!response.ok) throw new Error(`OSCQuery parameter read failed (${response.status})`);
        const nodes = parameterNodesByAddress(await response.json());
        let populated = 0;
        for (const targetParam of target.parameters || []) {
          const key = parameterKey(targetParam);
          const node = nodes.get(targetParam.address);
          if (!node || node.VALUE === undefined || !params.has(key)) continue;
          params.get(key).value = scalarValue(node.VALUE);
          populated += 1;
        }
        renderPanels();
        setStatus(`Got ${populated} parameter${populated === 1 ? "" : "s"} from ${target.label || target.id}`);
      } finally {
        getDataButton.disabled = targets.length === 0;
      }
    }

    function parameterNodesByAddress(root) {
      const nodes = new Map();
      const visit = (node) => {
        if (!node || typeof node !== "object") return;
        if (node.FULL_PATH && node.VALUE !== undefined) nodes.set(node.FULL_PATH, node);
        for (const child of Object.values(node.CONTENTS || {})) visit(child);
      };
      visit(root);
      return nodes;
    }

    function renderPanels() {
      const assigned = new Set();
      const groups = DRUMBOX_GROUPS.map((group) => {
        let members = group.controls
          ? group.controls.map((key) => params.get(key)).filter((param) => param && !assigned.has(parameterKey(param)))
          : [...params.values()].filter((param) => !assigned.has(parameterKey(param)) && parameterPath(param).startsWith(group.prefix));
        if (group.order) members = orderGroup(members, group.prefix, group.order);
        members.forEach((param) => assigned.add(parameterKey(param)));
        return { ...group, params: members };
      });
      const other = [...params.values()].filter((param) => !assigned.has(parameterKey(param))).sort(byIndex);
      if (other.length) groups.push({ title: "Other", key: "other", params: other });
      const nodes = groups.filter((group) => group.params.length).map(renderGroup);
      panelsEl.replaceChildren(...nodes);
      if (!nodes.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = targets.length ? "No Drumbox parameters reported." : "No online Drumbox targets.";
        panelsEl.append(empty);
      }
    }

    function orderGroup(members, prefix, order) {
      const priority = new Map(order.map((name, index) => [name, index]));
      return members.sort((a, b) => (priority.get(parameterPath(a).slice(prefix.length)) ?? 999) - (priority.get(parameterPath(b).slice(prefix.length)) ?? 999) || byIndex(a, b));
    }

    function renderGroup(group) {
      const section = document.createElement("section");
      section.className = "panel";
      section.dataset.group = group.key;
      const title = document.createElement("h2");
      title.textContent = group.title;
      const controls = document.createElement("div");
      controls.className = "controls";
      controls.replaceChildren(...group.params.map(renderControl));
      section.replaceChildren(title, controls);
      return section;
    }

    function renderControl(param) {
      if (Array.isArray(param.values) && param.values.length === 2) return renderSwitch(param);
      if (Array.isArray(param.values) && param.values.length) return renderChoice(param);
      const min = finite(param.min, 0);
      const max = finite(param.max, 1);
      const value = clamp(finite(param.value, min), min, max);
      const curved = shouldCurve(param, min, max);
      const key = parameterKey(param);
      const wrap = document.createElement("div");
      wrap.className = "control";
      const label = document.createElement("label");
      label.className = "control-label";
      label.htmlFor = `param-${cssSafe(key)}`;
      label.textContent = labelFor(param);
      const output = document.createElement("output");
      output.className = "control-readout";
      output.textContent = format(value, param.unit);
      const input = document.createElement("input");
      input.className = "vertical-slider";
      input.id = label.htmlFor;
      input.type = "range";
      input.min = curved ? 0 : min;
      input.max = curved ? 1 : max;
      input.step = curved ? .001 : stepFor(param, min, max);
      input.value = curved ? valueToSliderPosition(param, value, min, max) : value;
      input.addEventListener("input", () => {
        const next = sliderValue(param, input, min, max, curved);
        param.value = next;
        output.textContent = format(next, param.unit);
        scheduleSend(key, next);
      });
      bindRangeCommit(input, () => flushSend(key, sliderValue(param, input, min, max, curved)));
      wrap.replaceChildren(label, input, output);
      return wrap;
    }

    function renderChoice(param) {
      const key = parameterKey(param);
      const value = String(param.value ?? param.values[0]);
      const wrap = document.createElement("div");
      wrap.className = "control choice-control";
      const label = document.createElement("label");
      label.className = "control-label";
      label.htmlFor = `param-${cssSafe(key)}`;
      label.textContent = labelFor(param);
      const select = document.createElement("select");
      select.className = "choice-select";
      select.id = label.htmlFor;
      for (const choice of param.values) {
        const option = document.createElement("option");
        option.value = String(choice);
        option.textContent = splitCamel(choice);
        option.selected = String(choice) === value;
        select.append(option);
      }
      const output = document.createElement("output");
      output.className = "control-readout";
      output.textContent = splitCamel(value);
      select.addEventListener("change", () => {
        param.value = select.value;
        output.textContent = splitCamel(select.value);
        sendParam(key, select.value).catch(reportError);
        snapshotClient?.commitEdit();
      });
      wrap.replaceChildren(label, select, output);
      return wrap;
    }

    function renderSwitch(param) {
      const key = parameterKey(param);
      const choices = param.values.slice(0, 2).map(String);
      const currentIndex = Math.max(0, choices.indexOf(String(param.value ?? choices[0])));
      const wrap = document.createElement("div");
      wrap.className = "control choice-control";
      const label = document.createElement("label");
      label.className = "control-label";
      label.htmlFor = `param-${cssSafe(key)}`;
      label.textContent = labelFor(param);
      const switchWrap = document.createElement("label");
      switchWrap.className = "choice-switch";
      const input = document.createElement("input");
      input.id = label.htmlFor;
      input.type = "checkbox";
      input.setAttribute("role", "switch");
      input.checked = currentIndex === 1;
      const track = document.createElement("span");
      track.className = "choice-switch-track";
      track.setAttribute("aria-hidden", "true");
      const output = document.createElement("output");
      output.className = "control-readout";
      const updateState = () => {
        const value = choices[input.checked ? 1 : 0];
        output.textContent = compactChoiceLabel(value);
        output.title = splitCamel(value);
        input.setAttribute("aria-label", `${labelFor(param)}: ${splitCamel(value)}`);
        input.setAttribute("aria-valuetext", splitCamel(value));
        return value;
      };
      updateState();
      input.addEventListener("change", () => {
        const value = updateState();
        param.value = value;
        sendParam(key, value).catch(reportError);
        snapshotClient?.commitEdit();
      });
      switchWrap.append(input, track);
      wrap.replaceChildren(label, switchWrap, output);
      return wrap;
    }

    function scheduleSend(key, value) {
      if (pending.has(key)) clearTimeout(pending.get(key));
      pending.set(key, setTimeout(() => {
        pending.delete(key);
        sendParam(key, value).catch(reportError);
      }, 90));
    }

    function flushSend(key, value) {
      if (pending.has(key)) clearTimeout(pending.get(key));
      pending.delete(key);
      sendParam(key, value).catch(reportError);
    }

    async function sendParam(key, value) {
      const selected = [...document.querySelectorAll("[data-target]:checked")].map((input) => input.dataset.target).filter(Boolean);
      if (!selected.length) return setStatus("No targets selected");
      if (params.has(key)) params.get(key).value = value;
      const sends = selected.map(async (targetId) => {
        const target = targets.find((entry) => entry.id === targetId);
        const targetParam = target?.parameters?.find((entry) => parameterKey(entry) === key);
        if (!targetParam?.address) return false;
        const response = await fetch("/osc/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ targets: [targetId], address: targetParam.address, args: [value] })
        });
        const body = await response.json().catch(() => ({}));
        return response.ok && body.ok !== false;
      });
      const results = await Promise.all(sends);
      const sent = results.filter(Boolean).length;
      setStatus(sent === selected.length ? `Sent ${labelFor(params.get(key))} to ${sent}/${selected.length}` : `Failed ${labelFor(params.get(key))} (${sent}/${selected.length})`);
    }

    function bindRangeCommit(input, flushLive) {
      let gesture = null;
      input.addEventListener("pointerdown", () => { gesture = snapshotClient?.beginGesture() ?? null; });
      input.addEventListener("pointerup", () => {
        const completed = gesture;
        if (completed) snapshotClient?.commitGesture(completed);
        queueMicrotask(() => { if (gesture === completed) gesture = null; });
      });
      input.addEventListener("pointercancel", () => {
        if (gesture) snapshotClient?.cancelGesture(gesture);
        gesture = null;
      });
      input.addEventListener("change", () => {
        flushLive();
        if (gesture) snapshotClient?.commitGesture(gesture);
        else snapshotClient?.commitEdit();
        gesture = null;
      });
    }

    function serializeSnapshotState() {
      return createOscEditorSnapshot({ app: "drumbox", paramEntries: Array.from(params, ([name, param]) => ({ name, value: param.value, values: param.values })) });
    }

    function displaySavedState(snapshot) {
      for (const [name, value] of Object.entries(snapshot.params ?? {})) if (params.has(name)) params.get(name).value = oscEditorParamValue(params.get(name), value);
      renderPanels();
    }

    function parameterKey(param) { return param?.key || param?.name || ""; }
    function parameterPath(param) { return param?.path || parameterKey(param); }
    function readSourceTarget() { return targets.find((entry) => entry.id === readSourceSelect.value); }
    function newestTarget() { return targets.reduce((latest, target) => Number(target.instance) > Number(latest?.instance ?? -1) ? target : latest, null); }
    function oscQueryHost(target) { return !target.host || ["127.0.0.1", "localhost", "::1"].includes(target.host) ? location.hostname : target.host; }
    function scalarValue(value) { return Array.isArray(value) ? value[0] : value; }
    function byIndex(a, b) { return (a.index ?? 9999) - (b.index ?? 9999); }
    function labelFor(param) { return param?.meta?.label || LABELS[param?.name] || splitCamel(param?.displayName || param?.name || "Parameter"); }
    function stepFor(param, min, max) { if (/^(?:Note|Sample|Transpose|Pitch)$/.test(String(param?.name || ""))) return 1; if (Number(param.steps) > 1) return (max - min) / (Number(param.steps) - 1); const step = finite(param.meta?.edit_step, NaN); if (step > 0) return step; const range = Math.abs(max - min); return range > 64 ? (Number.isInteger(Number(param.value)) ? 1 : .1) : range > 8 ? .1 : .01; }
    function shouldCurve(param, min, max) { const name = String(param?.name || ""); const unit = String(param?.unit || param?.meta?.unit || "").toLowerCase(); return /decay/i.test(name) || (unit === "ms" && Math.abs(max - min) >= 1000); }
    function curveExponent() { return 3; }
    function valueToSliderPosition(param, value, min, max) { return Math.pow(clamp((finite(value, min) - min) / (max - min), 0, 1), 1 / curveExponent(param)); }
    function sliderValue(param, input, min, max, curved) { if (!curved) return Number(input.value); const value = min + ((max - min) * Math.pow(clamp(Number(input.value), 0, 1), curveExponent(param))); const step = stepFor(param, min, max); return clamp(min + (Math.round((value - min) / step) * step), min, max); }
    function format(value, unit) { const number = Number(value); const text = Number.isInteger(number) ? String(number) : number.toFixed(Math.abs(number) >= 10 ? 1 : 2).replace(/\.?0+$/, ""); return `${text}${unit ? ` ${unit}` : ""}`; }
    function finite(value, fallback) { const number = Number(value); return Number.isFinite(number) ? number : fallback; }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function splitCamel(value) { return String(value || "").replace(/([a-z0-9])([A-Z])/g, "$1 $2"); }
    function compactChoiceLabel(value) { const text = String(value || ""); if (/^oneshot$/i.test(text)) return "SHOT"; if (/^envelope$/i.test(text)) return "ENV"; return splitCamel(text); }
    function cssSafe(value) { return String(value).replace(/[^a-zA-Z0-9_-]/g, "-"); }
    function setStatus(message) { statusEl.textContent = message; }
    function reportError(error) { refreshButton.disabled = false; setStatus(error.message || "Drumbox editor failed"); }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char])); }
  </script>
</body>
</html>
