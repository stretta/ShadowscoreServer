<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSC Macros</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <script type="module" src="/shared/shadowscore-nav.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100vh;
    }

    .macro-header {
      align-items: center;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      min-height: 56px;
      padding: 10px 18px;
    }

    .macro-header h1 {
      font-size: 18px;
      margin: 0;
    }

    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      color: var(--ss-muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-width: 15rem;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(240px, 0.8fr) minmax(360px, 1.2fr);
      min-height: 0;
      padding: 14px 18px 20px;
    }

    .transpose-panel {
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      display: grid;
      gap: 12px;
      margin: 0 18px;
      padding: 14px;
    }

    .transpose-heading {
      align-items: baseline;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: space-between;
    }

    .transpose-heading h2 {
      font-size: 17px;
      margin: 0;
    }

    .transpose-controls {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
    }

    .transpose-control {
      align-items: end;
      background: var(--ss-surface);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(110px, 1fr) auto;
      padding: 10px;
    }

    .transpose-control input {
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .capture-row {
      align-items: end;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(220px, 1fr) auto;
    }

    .panel {
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .macro-list {
      display: grid;
      gap: 8px;
    }

    .macro-card {
      background: var(--ss-surface);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      display: grid;
      gap: 10px;
      padding: 10px;
    }

    .macro-name {
      color: var(--ss-text);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--ss-muted);
      font-size: 12px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    form {
      display: grid;
      gap: 12px;
    }

    .fields {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .step-builder {
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(140px, 1fr) minmax(90px, auto) minmax(80px, auto) auto;
    }

    label {
      display: grid;
      gap: 4px;
    }

    label span {
      color: var(--ss-muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 260px;
      resize: vertical;
      width: 100%;
    }

    .validation {
      display: grid;
      gap: 6px;
    }

    .validation-row {
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-control);
      display: grid;
      gap: 8px;
      grid-template-columns: auto 1fr;
      padding: 8px;
    }

    .badge {
      border-radius: 999px;
      color: #07110a;
      font-size: 11px;
      font-weight: 900;
      min-width: 42px;
      padding: 3px 7px;
      text-align: center;
      text-transform: uppercase;
    }

    .badge.ok {
      background: var(--ss-accent-strong);
    }

    .badge.fail {
      background: var(--ss-danger);
      color: #260909;
    }

    .empty-state {
      color: var(--ss-muted);
      padding: 10px 0;
    }

    @media (max-width: 860px) {
      .macro-header {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        min-width: 0;
        text-align: left;
      }

      .workspace,
      .fields,
      .step-builder,
      .transpose-controls,
      .capture-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="ss-route-tabs" aria-label="ShadowScore navigation" data-shadow-nav>
    <a href="/piano-roll">ShadowScore</a>
    <a href="/structure-editor">Arrange</a>
    <a href="/editors" aria-current="page">OSC</a>
    <a href="/">Setup</a>
  </nav>
  <main>
    <header class="macro-header">
      <h1>OSC Macros</h1>
      <div class="actions">
        <button id="refresh" type="button">Refresh</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </header>
    <section class="transpose-panel" aria-labelledby="transpose-heading">
      <div class="transpose-heading">
        <h2 id="transpose-heading">Ensemble Transpose</h2>
        <span id="transpose-targets" class="meta">Discovering compatible instances…</span>
      </div>
      <div class="transpose-controls">
        <div class="transpose-control">
          <label><span>Chromatic Transpose</span><input id="chromatic-value" type="number" step="1" value="0"></label>
          <div class="actions">
            <button type="button" data-transpose-dry="ChromaticTranspose">Dry Run</button>
            <button type="button" class="primary" data-transpose-run="ChromaticTranspose">Apply Live</button>
          </div>
        </div>
        <div class="transpose-control">
          <label><span>Scalar Transpose</span><input id="scalar-value" type="number" step="1" value="0"></label>
          <div class="actions">
            <button type="button" data-transpose-dry="ScalarTranspose">Dry Run</button>
            <button type="button" class="primary" data-transpose-run="ScalarTranspose">Apply Live</button>
          </div>
        </div>
      </div>
      <div class="capture-row">
        <label><span>EDITING Block</span><select id="capture-block"></select></label>
        <button id="capture-transpose" type="button">Capture Compatible Instances to EDITING Block</button>
      </div>
      <div class="meta">Apply Live changes running instances only. Capture explicitly saves each compatible instance’s complete live state to its role-specific snapshot in the selected block.</div>
    </section>
    <section class="workspace">
      <aside class="panel">
        <div id="macros" class="macro-list"></div>
      </aside>
      <section class="panel">
        <form id="editor">
          <div class="fields">
            <label><span>ID</span><input id="macro-id" autocomplete="off"></label>
            <label><span>Label</span><input id="macro-label" autocomplete="off"></label>
          </div>
          <div class="step-builder">
            <label><span>Target</span><select id="step-target"></select></label>
            <label><span>Param</span><select id="step-param"><option>VolA</option><option>VolB</option></select></label>
            <label><span>Value</span><input id="step-value" type="number" min="-70" max="0" step="1" value="0"></label>
            <button id="add-step" type="button">Add Step</button>
          </div>
          <textarea id="macro" spellcheck="false"></textarea>
          <div class="actions">
            <button type="submit" class="primary">Save</button>
            <button type="button" id="dry-run">Dry Run</button>
            <button type="button" id="run">Run</button>
          </div>
          <div id="validation" class="validation" aria-live="polite"></div>
        </form>
      </section>
    </section>
  </main>
  <script>
    const macrosEl = document.querySelector("#macros");
    const macroEl = document.querySelector("#macro");
    const macroIdEl = document.querySelector("#macro-id");
    const macroLabelEl = document.querySelector("#macro-label");
    const statusEl = document.querySelector("#status");
    const validationEl = document.querySelector("#validation");
    const stepTargetEl = document.querySelector("#step-target");
    const stepParamEl = document.querySelector("#step-param");
    const stepValueEl = document.querySelector("#step-value");
    const refreshButton = document.querySelector("#refresh");
    const captureBlockEl = document.querySelector("#capture-block");
    const captureButton = document.querySelector("#capture-transpose");
    const transposeTargetsEl = document.querySelector("#transpose-targets");
    let macros = [];
    let targets = [];
    let score = null;

    setMacro({
      id: "transpose-scalar",
      label: "Scalar Transpose",
      steps: [{
        where: { capability: "ttid-edit", status: "online", parameter: "ScalarTranspose" },
        param: "ScalarTranspose",
        args: [0]
      }]
    });

    refreshButton.addEventListener("click", () => refresh().catch(reportError));
    document.querySelector("#add-step").addEventListener("click", addStep);
    document.querySelector("#dry-run").addEventListener("click", () => saveAndRun(true).catch(reportError));
    document.querySelector("#run").addEventListener("click", () => saveAndRun(false).catch(reportError));
    document.querySelector("#editor").addEventListener("submit", async (event) => {
      event.preventDefault();
      await saveCurrent();
      await refresh();
    });
    macroIdEl.addEventListener("input", syncHeaderToJson);
    macroLabelEl.addEventListener("input", syncHeaderToJson);
    for (const button of document.querySelectorAll("[data-transpose-dry]")) {
      button.addEventListener("click", () => runTranspose(button.dataset.transposeDry, true).catch(reportError));
    }
    for (const button of document.querySelectorAll("[data-transpose-run]")) {
      button.addEventListener("click", () => runTranspose(button.dataset.transposeRun, false).catch(reportError));
    }
    captureButton.addEventListener("click", () => captureTransposeState().catch(reportError));

    async function refresh() {
      refreshButton.disabled = true;
      setStatus("Refreshing");
      const [macroResponse, targetResponse, scoreResponse] = await Promise.all([
        fetch("/osc/macros"),
        fetch("/osc/targets?status=online"),
        fetch("/score", { cache: "no-store" })
      ]);
      const macroBody = await macroResponse.json();
      const targetBody = await targetResponse.json();
      const scoreBody = await scoreResponse.json();
      macros = macroBody.macros || [];
      targets = targetBody.targets || [];
      score = scoreBody;
      renderMacros();
      renderTargets();
      renderTransposeTargets();
      renderBlocks();
      setStatus(`${macros.length} macro${macros.length === 1 ? "" : "s"}, ${targets.length} target${targets.length === 1 ? "" : "s"}`);
      refreshButton.disabled = false;
    }

    function renderMacros() {
      const cards = macros.map((macro) => {
        const card = document.createElement("section");
        card.className = "macro-card";
        card.innerHTML = `
          <div>
            <div class="macro-name">${escapeHtml(macro.label || macro.id)}</div>
            <div class="meta">${escapeHtml(macro.id)} &middot; ${(macro.steps || []).length} step${(macro.steps || []).length === 1 ? "" : "s"}</div>
          </div>
        `;
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(
          button("Load", () => setMacro(macro)),
          button("Dry", () => runMacro(macro.id, true).catch(reportError)),
          button("Run", () => runMacro(macro.id, false).catch(reportError))
        );
        card.append(actions);
        return card;
      });
      macrosEl.replaceChildren(...cards);
      if (cards.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No saved OSC macros.";
        macrosEl.append(empty);
      }
    }

    function renderTargets() {
      const options = targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = `${target.label || target.id} (${target.unitId || target.id})`;
        return option;
      });
      stepTargetEl.replaceChildren(...options);
    }

    function renderTransposeTargets() {
      const scalar = compatibleTransposeTargets("ScalarTranspose");
      const chromatic = compatibleTransposeTargets("ChromaticTranspose");
      transposeTargetsEl.textContent = `${chromatic.length} chromatic · ${scalar.length} scalar compatible instance${Math.max(chromatic.length, scalar.length) === 1 ? "" : "s"}`;
      captureButton.disabled = compatibleTransposeTargets().length === 0;
    }

    function renderBlocks() {
      const previous = captureBlockEl.value;
      const options = Object.entries(score?.mesostructure || {}).map(([blockId, block]) => {
        const option = document.createElement("option");
        option.value = blockId;
        option.textContent = block.name ? `${blockId} · ${block.name}` : blockId;
        return option;
      });
      captureBlockEl.replaceChildren(...options);
      const activeBlockId = score?.structureState?.activeBlockId;
      captureBlockEl.value = options.some((option) => option.value === previous)
        ? previous
        : options.some((option) => option.value === activeBlockId) ? activeBlockId : options[0]?.value || "";
      captureButton.disabled = !captureBlockEl.value || compatibleTransposeTargets().length === 0;
    }

    function compatibleTransposeTargets(parameter) {
      return targets.filter((target) => (target.capabilities || []).includes("ttid-edit")
        && (target.parameters || []).some((entry) => parameter
          ? entry.name === parameter
          : entry.name === "ScalarTranspose" || entry.name === "ChromaticTranspose"));
    }

    function transposeInput(parameter) {
      return document.querySelector(parameter === "ScalarTranspose" ? "#scalar-value" : "#chromatic-value");
    }

    function transposeMacro(parameter) {
      return {
        id: parameter === "ScalarTranspose" ? "transpose-scalar" : "transpose-chromatic",
        label: parameter === "ScalarTranspose" ? "Scalar Transpose" : "Chromatic Transpose",
        steps: [{
          where: { capability: "ttid-edit", status: "online", parameter },
          param: parameter,
          args: [Number(transposeInput(parameter).value)]
        }]
      };
    }

    async function runTranspose(parameter, dryRun) {
      const macro = transposeMacro(parameter);
      if (!Number.isFinite(macro.steps[0].args[0])) throw new Error(`${macro.label} must be numeric`);
      setStatus(dryRun ? `Dry run ${macro.label}` : `Applying ${macro.label} live`);
      const response = await fetch("/osc/macros/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ macro, dryRun })
      });
      const body = await response.json().catch(() => ({}));
      renderValidation(body.validation || []);
      if (!response.ok || body.ok === false) throw new Error(body.error || `Validation failed for ${macro.label}`);
      const count = dryRun ? body.validation.length : (body.results || []).filter((result) => result.ok).length;
      setStatus(dryRun ? `${macro.label}: ${count} compatible instance${count === 1 ? "" : "s"}` : `${macro.label} applied live to ${count} instance${count === 1 ? "" : "s"}; score unchanged`);
    }

    async function captureTransposeState() {
      const blockId = captureBlockEl.value;
      const selected = compatibleTransposeTargets();
      if (!blockId) throw new Error("Choose an EDITING block");
      if (!selected.length) throw new Error("No compatible transpose instances are online");
      const label = `${selected.length} compatible instance${selected.length === 1 ? "" : "s"} into block ${blockId}`;
      if (!confirm(`Capture complete live state from ${label}? Existing Written snapshots for these roles will be replaced.`)) return;
      captureButton.disabled = true;
      setStatus(`Capturing ${label}`);
      try {
        const response = await fetch("/osc/block-state/capture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            blockId,
            targets: selected.map((target) => target.id),
            expectedStructureRevision: score?.structureRevision
          })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || body.ok === false) throw new Error(body.error || "Capture failed");
        score = body.score;
        renderBlocks();
        setStatus(`Captured ${body.capturedCount} instance${body.capturedCount === 1 ? "" : "s"} into block ${blockId}`);
      } finally {
        captureButton.disabled = compatibleTransposeTargets().length === 0;
      }
    }

    async function saveCurrent() {
      const macro = currentMacro();
      const response = await fetch("/osc/macros", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(macro)
      });
      const body = await response.json();
      if (!response.ok || body.ok === false) throw new Error(body.error || "Save failed");
      setMacro(body.macro);
      setStatus(`Saved ${body.macro.id}`);
      return body.macro;
    }

    async function saveAndRun(dryRun) {
      const macro = await saveCurrent();
      await refresh();
      await runMacro(macro.id, dryRun);
    }

    async function runMacro(id, dryRun) {
      setStatus(dryRun ? `Dry run ${id}` : `Run ${id}`);
      const response = await fetch(`/osc/macros/${encodeURIComponent(id)}/run`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dryRun })
      });
      const body = await response.json();
      renderValidation(body.validation || []);
      if (!response.ok || body.ok === false) {
        setStatus(body.error || `Validation failed for ${id}`);
        return;
      }
      setStatus(dryRun ? `Dry run OK: ${id}` : `Ran ${id}: ${(body.results || []).filter((result) => result.ok).length}/${(body.results || []).length}`);
    }

    function addStep() {
      const macro = currentMacro();
      const target = stepTargetEl.value;
      if (!target) {
        setStatus("No target selected");
        return;
      }
      macro.steps.push({
        target,
        param: stepParamEl.value,
        args: [Number(stepValueEl.value)]
      });
      setMacro(macro);
    }

    function currentMacro() {
      const macro = JSON.parse(macroEl.value);
      macro.id = slug(macroIdEl.value || macro.id || macro.label);
      macro.label = macroLabelEl.value || macro.label || macro.id;
      macro.steps = Array.isArray(macro.steps) ? macro.steps : [];
      return macro;
    }

    function setMacro(macro) {
      macroIdEl.value = macro.id || "";
      macroLabelEl.value = macro.label || macro.id || "";
      macroEl.value = JSON.stringify(macro, null, 2);
      validationEl.replaceChildren();
    }

    function syncHeaderToJson() {
      try {
        const macro = currentMacro();
        macroEl.value = JSON.stringify(macro, null, 2);
      } catch {
        return;
      }
    }

    function renderValidation(validation) {
      const rows = validation.map((step) => {
        const row = document.createElement("div");
        row.className = "validation-row";
        const target = step.target || (step.selector ? `selector ${JSON.stringify(step.selector)}` : "no target");
        row.innerHTML = `
          <span class="badge ${step.ok ? "ok" : "fail"}">${step.ok ? "OK" : "Fail"}</span>
          <span class="meta">${escapeHtml(target)} ${escapeHtml(step.param || step.address || "")} ${escapeHtml(step.error || step.address || "")}</span>
        `;
        return row;
      });
      validationEl.replaceChildren(...rows);
    }

    function button(label, onClick) {
      const element = document.createElement("button");
      element.type = "button";
      element.textContent = label;
      element.addEventListener("click", onClick);
      return element;
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function reportError(error) {
      refreshButton.disabled = false;
      setStatus(error.message || String(error));
    }

    function slug(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    refresh().catch(reportError);
  </script>
</body>
</html>
