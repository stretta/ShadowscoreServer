<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poland Editor</title>
  <link rel="stylesheet" href="/shared/shadowscore-style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(105, 199, 223, 0.08), transparent 220px),
        var(--ss-bg);
    }

    main {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100vh;
    }

    .editor-header {
      align-items: center;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      min-height: 56px;
      padding: 10px 18px;
    }

    .editor-header h1 {
      font-size: 18px;
      margin: 0;
    }

    .actions {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 0;
    }

    .status {
      min-width: 15rem;
      overflow: hidden;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-strip {
      align-items: stretch;
      border-bottom: 1px solid var(--ss-border);
      display: flex;
      gap: 8px;
      min-height: 58px;
      overflow-x: auto;
      padding: 8px 18px 10px;
    }

    .target-card {
      align-items: center;
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      cursor: pointer;
      display: grid;
      flex: 0 0 188px;
      gap: 2px 8px;
      grid-template-columns: auto 1fr;
      padding: 8px 10px;
    }

    .target-card input {
      grid-row: 1 / span 2;
      margin: 0;
    }

    .target-name {
      color: var(--ss-text);
      font-weight: 800;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-detail {
      color: var(--ss-muted);
      font-size: 12px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .synth-param-panel {
      min-height: 0;
      overflow: auto;
      padding: 14px 18px 20px;
    }

    .synth-param-grid {
      align-items: stretch;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      min-width: 0;
    }

    .control-group {
      --group-accent: var(--ss-accent-secondary);
      background: var(--ss-panel);
      border: 1px solid var(--ss-border);
      border-radius: var(--ss-radius-ui);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-start;
      min-width: 0;
      padding: 28px 7px 8px;
      position: relative;
    }

    .control-group::before {
      background: var(--group-accent);
      border-radius: calc(var(--ss-radius-ui) - 1px) calc(var(--ss-radius-ui) - 1px) 0 0;
      content: "";
      height: 22px;
      inset: 0 0 auto;
      position: absolute;
    }

    .control-group[data-group="oscillator-a"] {
      --group-accent: #d94645;
    }

    .control-group[data-group="oscillator-b"],
    .control-group[data-group="filter"],
    .control-group[data-group="midi"] {
      --group-accent: #0284a8;
    }

    .control-group[data-group="motion"] {
      --group-accent: #6d63c4;
    }

    .control-group[data-group="filter-env"] {
      --group-accent: #d97706;
    }

    .control-group[data-group="vca-env"] {
      --group-accent: #0f9f8e;
    }

    .control-group-title {
      align-items: center;
      color: #ffffff;
      display: flex;
      font-size: 11px;
      font-weight: 800;
      height: 22px;
      inset: 0 0 auto;
      justify-content: center;
      letter-spacing: 0.08em;
      line-height: 1;
      margin: 0;
      position: absolute;
      text-align: center;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
      text-transform: uppercase;
      z-index: 1;
    }

    .control-group-grid {
      align-items: flex-end;
      display: flex;
      gap: 5px;
      justify-content: center;
      min-height: 158px;
      min-width: max-content;
    }

    .control-strip {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 48px;
    }

    .control-label {
      color: var(--ss-text);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
      max-width: 58px;
      min-height: 22px;
      overflow-wrap: anywhere;
      text-align: center;
      text-transform: uppercase;
    }

    .control-readout {
      color: var(--ss-muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      min-height: 14px;
      text-align: center;
    }

    .vertical-slider {
      accent-color: var(--group-accent);
      appearance: auto;
      direction: rtl;
      height: 114px;
      margin: 0;
      width: 20px;
      writing-mode: vertical-lr;
    }

    .choice-options {
      align-content: center;
      display: grid;
      gap: 4px;
      min-height: 114px;
      width: 48px;
    }

    .choice-option {
      align-items: center;
      background: var(--ss-surface);
      border: 1px solid var(--ss-border-strong);
      border-radius: var(--ss-radius-control);
      color: var(--ss-text);
      display: flex;
      font-size: 12px;
      font-weight: 800;
      height: 28px;
      justify-content: center;
      min-height: 28px;
      padding: 0 6px;
    }

    .choice-option[data-active="true"] {
      background: color-mix(in srgb, var(--group-accent) 28%, var(--ss-surface));
      border-color: var(--group-accent);
    }

    .empty-state {
      align-items: center;
      color: var(--ss-muted);
      display: flex;
      min-height: 180px;
      padding: 0 4px;
    }

    @media (max-width: 720px) {
      .editor-header {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        justify-content: space-between;
      }

      .status {
        min-width: 0;
        text-align: left;
      }

      .target-card {
        flex-basis: 164px;
      }

      .synth-param-panel {
        padding-inline: 12px;
      }
    }
  </style>
</head>
<body>
  <nav class="ss-route-tabs" aria-label="ShadowScore routes">
    <a href="/">Dashboard</a><a href="/structure-editor">Structure</a><a href="/matrix-edit">Matrix</a>
    <a href="/piano-roll">Piano Roll</a><a href="/event-list">Event List</a>
    <a href="/editors" aria-current="page">OSC Generators</a><a href="/admin">Admin</a><a href="/transport/status">Transport</a>
  </nav>
  <main>
    <header class="editor-header">
      <h1>Poland Editor</h1>
      <div class="actions">
        <label for="read-source">Instance focus</label>
        <select id="read-source" aria-label="Instance focus"></select>
        <button id="get-data" type="button">Read Instance</button>
        <button id="refresh" type="button">Refresh</button>
        <span id="status" class="status" role="status"></span>
      </div>
    </header>
    <section class="synth-param-panel">
      <div id="controls" class="synth-param-grid"></div>
    </section>
    <div id="snapshot-mount"></div>
    <section class="ss-osc-live-target-panel"><div class="ss-osc-live-target-head"><h2>Live And Save Destinations</h2><span>Checked instances receive live control changes and the saved Block State.</span></div><div id="targets" class="target-strip" aria-label="Poland targets"></div></section>
  </main>
  <script type="module">
    import { createOscEditorSnapshot, createOscSnapshotEditorClient, mountOscSnapshotPanel, oscEditorParamValue } from "/shared/osc-snapshot-editor.js?v=20260724-instant-write1";
    const POLAND_GROUPS = [
      { title: "MIDI", key: "midi", controls: ["TransposePoland"] },
      { title: "OSC A", key: "oscillator-a", controls: ["VolA", "PitchBiasCoarseA", "PitchBiasFineA", "WavetableA", "WaveBiasA", "WaveModVelA", "WaveModVelRandA", "WaveEnvModDistanceA", "WaveEnvModTimeA"] },
      { title: "OSC B", key: "oscillator-b", controls: ["VolB", "PitchBiasCoarseB", "PitchBiasFineB", "WavetableB", "WaveBiasB", "WaveModVelB", "WaveModVelRandB", "WaveEnvModDistanceB", "WaveEnvModTimeB"] },
      { title: "Motion", key: "motion", controls: ["VibRate", "VibAmt", "Portamento", "Spread"] },
      { title: "Filter", key: "filter", controls: ["HPFFreq", "FilterBias", "FilterResonance", "FilterVelocity", "FilterKeyTracking", "FilterEnvAmt", "FilterLFORate", "FilterLFOAmt"] },
      { title: "Filter Env", key: "filter-env", controls: ["FilterAttack", "FilterDecay", "FilterSustain", "FilterRelease"] },
      { title: "VCA Env", key: "vca-env", controls: ["VCAAttack", "VCADecay", "VCASustain", "VCARelease", "VCAVelocity"] }
    ];

    const LABEL_OVERRIDES = new Map(Object.entries({
      VolA: "Volume",
      VolB: "Volume",
      PitchBiasCoarseA: "Coarse",
      PitchBiasFineA: "Fine",
      PitchBiasCoarseB: "Coarse",
      PitchBiasFineB: "Fine",
      WaveEnvModDistanceA: "Env Amt",
      WaveEnvModTimeA: "Env Time",
      WaveEnvModDistanceB: "Env Amt",
      WaveEnvModTimeB: "Env Time",
      WaveModVelA: "Velocity",
      WaveModVelB: "Velocity",
      WaveModVelRandA: "Vel Rand",
      WaveModVelRandB: "Vel Rand",
      WaveBiasA: "Bias",
      WaveBiasB: "Bias",
      WavetableA: "Wave",
      WavetableB: "Wave",
      HPFFreq: "High Pass",
      Portamento: "Glide",
      FilterResonance: "Res",
      FilterVelocity: "Velocity",
      FilterKeyTracking: "Key Track",
      FilterEnvAmt: "Env",
      FilterLFORate: "LFO Rate",
      FilterLFOAmt: "LFO Amt",
      FilterAttack: "Attack",
      FilterDecay: "Decay",
      FilterSustain: "Sustain",
      FilterRelease: "Release",
      VCAAttack: "Attack",
      VCADecay: "Decay",
      VCASustain: "Sustain",
      VCARelease: "Release",
      VCAVelocity: "Velocity",
      TransposePoland: "Transpose"
    }));

    const targetsEl = document.querySelector("#targets");
    const controlsEl = document.querySelector("#controls");
    const statusEl = document.querySelector("#status");
    const refreshButton = document.querySelector("#refresh");
    const readSourceSelect = document.querySelector("#read-source");
    const getDataButton = document.querySelector("#get-data");
    let targets = [];
    let paramState = new Map();
    const pendingSends = new Map();
    let snapshotClient;

    refreshButton.addEventListener("click", () => {
      refresh().catch(reportError);
    });
    getDataButton.addEventListener("click", () => getData().catch(reportError));

    async function refresh() {
      refreshButton.disabled = true;
      const response = await fetch("/osc/targets?app=poland&status=online");
      const body = await response.json();
      if (!response.ok || body.ok === false) {
        throw new Error(body.error || `Request failed: ${response.status}`);
      }
      targets = body.targets || [];
      paramState = mergeParamState(targets);
      renderTargets();
      renderReadSources();
      renderControls();
      setStatus(targets.length ? `${targets.length} target${targets.length === 1 ? "" : "s"} online` : "No online Poland targets");
      refreshButton.disabled = false;
    }

    function mergeParamState(nextTargets) {
      const next = new Map();
      for (const target of nextTargets) {
        for (const param of target.parameters || []) {
          if (!next.has(param.name)) next.set(param.name, { ...param });
        }
      }
      for (const [name, existing] of paramState.entries()) {
        if (next.has(name)) next.get(name).value = existing.value;
      }
      return next;
    }

    function renderTargets() {
      const selected = new Set(Array.from(targetsEl.querySelectorAll("[data-target]:checked"), input => input.dataset.target));
      const focusedId = readSourceSelect.value || targets[0]?.id || "";
      const preserveSelection = targets.some(target => selected.has(target.id));
      const cards = targets.map((target) => {
        const label = document.createElement("label");
        label.className = "target-card";
        label.innerHTML = `
          <input type="checkbox" data-target="${escapeHtml(target.id)}">
          <span class="target-name">${escapeHtml(target.label || target.id)}</span>
          <span class="target-detail">${escapeHtml(target.unitId || "")} ${escapeHtml(target.baseAddress || "")}</span>
        `;
        label.querySelector("input").checked = preserveSelection ? selected.has(target.id) : target.id === focusedId;
        return label;
      });
      targetsEl.replaceChildren(...cards);
      if (cards.length === 0) targetsEl.textContent = "";
    }

    function renderReadSources() {
      const previous = readSourceSelect.value;
      readSourceSelect.replaceChildren(...targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = target.label || target.id;
        return option;
      }));
      readSourceSelect.value = targets.some((target) => target.id === previous) ? previous : (targets[0]?.id || "");
      readSourceSelect.disabled = targets.length === 0;
      getDataButton.disabled = targets.length === 0;
    }

    async function getData() {
      const target = targets.find((entry) => entry.id === readSourceSelect.value);
      if (!target) return setStatus("Choose an instance to get data from");
      getDataButton.disabled = true;
      setStatus(`Getting data from ${target.label || target.id}...`);
      try {
        const response = await fetch(`${location.protocol}//${oscQueryHost(target)}:5678${target.baseAddress}/params`, { cache: "no-store" });
        if (!response.ok) throw new Error(`OSCQuery parameter read failed (${response.status})`);
        const nodes = (await response.json()).CONTENTS || {};
        let populated = 0;
        for (const param of target.parameters || []) {
          const node = nodes[param.name];
          if (!node || node.VALUE === undefined || !paramState.has(param.name)) continue;
          paramState.get(param.name).value = scalarValue(node.VALUE);
          populated += 1;
        }
        renderControls();
        setStatus(`Got ${populated} parameter${populated === 1 ? "" : "s"} from ${target.label || target.id}`);
      } finally {
        getDataButton.disabled = targets.length === 0;
      }
    }

    function oscQueryHost(target) {
      return !target.host || ["127.0.0.1", "localhost", "::1"].includes(target.host) ? location.hostname : target.host;
    }

    function scalarValue(value) {
      return Array.isArray(value) ? value[0] : value;
    }

    function renderControls() {
      const groups = POLAND_GROUPS
        .map((group) => ({ ...group, params: group.controls.map((name) => paramState.get(name)).filter(Boolean) }))
        .filter((group) => group.params.length > 0);
      const nodes = groups.map(renderGroup);
      controlsEl.replaceChildren(...nodes);
      if (nodes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = targets.length ? "No Poland parameters reported." : "No online Poland targets.";
        controlsEl.append(empty);
      }
    }

    function renderGroup(group) {
      const section = document.createElement("section");
      section.className = "control-group";
      section.dataset.group = group.key;
      const title = document.createElement("h2");
      title.className = "control-group-title";
      title.textContent = group.title;
      const grid = document.createElement("div");
      grid.className = "control-group-grid";
      grid.replaceChildren(...group.params.map((param) => renderParam(param, group.key)));
      section.replaceChildren(title, grid);
      return section;
    }

    function renderParam(param, groupKey) {
      const strip = document.createElement("div");
      strip.className = "control-strip";
      strip.dataset.param = param.name;

      const label = document.createElement("div");
      label.className = "control-label";
      label.textContent = labelFor(param);

      const control = choiceValues(param).length ? renderChoice(param, groupKey) : renderSlider(param);

      const readout = document.createElement("output");
      readout.className = "control-readout";
      readout.value = String(valueFor(param));
      readout.textContent = formatValue(valueFor(param), param.unit);
      control.addEventListener("input", () => {
        readout.textContent = formatValue(controlValue(control), param.unit);
      });
      control.addEventListener("poland-choice", () => {
        readout.textContent = formatValue(controlValue(control), param.unit);
      });
      strip.replaceChildren(label, control, readout);
      return strip;
    }

    function renderSlider(param) {
      const min = finiteNumber(param.min, 0);
      const max = finiteNumber(param.max, 1);
      const curved = shouldCurve(param, min, max);
      const input = document.createElement("input");
      input.className = "vertical-slider";
      input.type = "range";
      input.min = curved ? "0" : String(min);
      input.max = curved ? "1" : String(max);
      input.step = curved ? "0.001" : String(stepFor(param, min, max));
      input.value = String(curved ? valueToSliderPosition(param, valueFor(param), min, max) : clamp(finiteNumber(valueFor(param), min), min, max));
      input.dataset.curved = String(curved);
      input.dataset.param = param.name;
      input.addEventListener("input", () => scheduleParamSend(param.name, sliderValue(param, input, min, max)));
      input.addEventListener("input", () => { paramState.get(param.name).value = sliderValue(param, input, min, max); });
      bindRangeCommit(input, () => flushParamSend(param.name, sliderValue(param, input, min, max)));
      return input;
    }

    function renderChoice(param) {
      const values = choiceValues(param);
      const wrap = document.createElement("div");
      wrap.className = "choice-options";
      wrap.dataset.param = param.name;
      wrap.dataset.value = String(valueFor(param));
      for (const value of values) {
        const button = document.createElement("button");
        button.className = "choice-option";
        button.type = "button";
        button.textContent = choiceLabel(value);
        button.dataset.value = String(value);
        button.dataset.active = String(String(value) === String(valueFor(param)));
        button.addEventListener("click", () => {
          wrap.dataset.value = String(value);
          paramState.get(param.name).value = parseChoiceValue(value);
          for (const option of wrap.querySelectorAll(".choice-option")) {
            option.dataset.active = String(option.dataset.value === String(value));
          }
          wrap.dispatchEvent(new CustomEvent("poland-choice"));
          sendParam(param.name, parseChoiceValue(value));
          snapshotClient?.commitEdit();
        });
        wrap.append(button);
      }
      return wrap;
    }

    function scheduleParamSend(param, value) {
      if (pendingSends.has(param)) clearTimeout(pendingSends.get(param));
      pendingSends.set(param, setTimeout(() => {
        pendingSends.delete(param);
        sendParam(param, value).catch(reportError);
      }, 90));
    }

    function flushParamSend(param, value) {
      if (pendingSends.has(param)) {
        clearTimeout(pendingSends.get(param));
        pendingSends.delete(param);
      }
      sendParam(param, value).catch(reportError);
    }

    async function sendParam(param, value) {
      const selected = selectedTargets();
      if (selected.length === 0) {
        setStatus("No targets selected");
        return;
      }
      if (paramState.has(param)) paramState.get(param).value = value;
      setStatus(`Sending ${labelFor({ name: param })}`);
      const response = await fetch("/osc/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ targets: selected, param, args: [value] })
      });
      const body = await response.json().catch(() => ({}));
      const sent = (body.results || []).filter((result) => result.ok).length;
      if (!response.ok || body.ok === false) {
        setStatus(`Failed ${labelFor({ name: param })} (${sent}/${selected.length})`);
        return;
      }
      setStatus(`Sent ${labelFor({ name: param })} to ${sent}/${selected.length}`);
    }

    function selectedTargets() {
      return Array.from(document.querySelectorAll("[data-target]:checked"))
        .map((input) => input.dataset.target)
        .filter(Boolean);
    }

    function choiceValues(param) {
      if (Array.isArray(param.values) && param.values.length) return param.values;
      if (Array.isArray(param.enum) && param.enum.length) return param.enum;
      if (Array.isArray(param.meta?.values) && param.meta.values.length) return param.meta.values;
      if (param.meta?.type === "boolean") return [0, 1];
      return [];
    }

    function valueFor(param) {
      return paramState.get(param.name)?.value ?? param.value ?? param.min ?? 0;
    }

    function bindRangeCommit(input, flushLive) {
      let gesture = null;
      input.addEventListener("pointerdown", () => { gesture = snapshotClient?.beginGesture() ?? null; });
      input.addEventListener("pointerup", () => {
        const completed = gesture;
        if (completed) snapshotClient?.commitGesture(completed);
        queueMicrotask(() => { if (gesture === completed) gesture = null; });
      });
      input.addEventListener("pointercancel", () => {
        if (gesture) snapshotClient?.cancelGesture(gesture);
        gesture = null;
      });
      input.addEventListener("change", () => {
        flushLive();
        if (gesture) snapshotClient?.commitGesture(gesture);
        else snapshotClient?.commitEdit();
        gesture = null;
      });
    }

    function serializeSnapshotState() {
      return createOscEditorSnapshot({ app: "poland", paramEntries: Array.from(paramState, ([name, param]) => ({ name, value: param.value, values: param.values })) });
    }

    function displaySavedState(snapshot) {
      for (const [name, value] of Object.entries(snapshot.params ?? {})) if (paramState.has(name)) paramState.get(name).value = oscEditorParamValue(paramState.get(name), value);
      renderControls();
    }

    function controlValue(control) {
      if (control.classList.contains("choice-options")) return control.dataset.value;
      const param = paramState.get(control.dataset.param);
      return sliderValue(param, control, finiteNumber(param?.min, 0), finiteNumber(param?.max, 1));
    }

    function parseChoiceValue(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) && String(value).trim() !== "" ? numeric : value;
    }

    function choiceLabel(value) {
      if (String(value) === "0") return "Off";
      if (String(value) === "1") return "On";
      return String(value);
    }

    function labelFor(param) {
      return LABEL_OVERRIDES.get(param.name) || param.displayName || param.name;
    }

    function stepFor(param, min, max) {
      const metaStep = finiteNumber(param.meta?.edit_step, NaN);
      if (Number.isFinite(metaStep) && metaStep > 0) return metaStep;
      const range = Math.abs(max - min);
      if (range > 64) return 1;
      if (range > 8) return 0.1;
      return 0.01;
    }

    function shouldCurve(param, min, max) {
      const name = String(param.name || "");
      const unit = String(param.unit || param.meta?.unit || "").toLowerCase();
      return /(?:attack|decay|release|env.*time)/i.test(name) || (unit === "ms" && Math.abs(max - min) >= 1000);
    }

    function curveExponent(param, min, max) {
      if (finiteNumber(param?._curveExponent, NaN) > 0) return param._curveExponent;
      const explicit = finiteNumber(param.exponent ?? param.meta?.exponent, NaN);
      if (explicit > 0) return (param._curveExponent = explicit);
      const normalized = finiteNumber(param.normalized, NaN);
      const linear = (finiteNumber(valueFor(param), min) - min) / (max - min);
      if (linear > 0.0001 && linear < 0.9999 && normalized > 0.0001 && normalized < 0.9999) {
        const inferred = Math.log(linear) / Math.log(normalized);
        if (inferred >= 0.5 && inferred <= 8) return (param._curveExponent = inferred);
      }
      return (param._curveExponent = /release/i.test(String(param.name || "")) ? 5 : 3);
    }

    function valueToSliderPosition(param, value, min, max) {
      const normalized = clamp((finiteNumber(value, min) - min) / (max - min), 0, 1);
      return Math.pow(normalized, 1 / curveExponent(param, min, max));
    }

    function sliderValue(param, input, min, max) {
      if (input.dataset.curved !== "true") return Number(input.value);
      const value = min + ((max - min) * Math.pow(clamp(Number(input.value), 0, 1), curveExponent(param, min, max)));
      const step = stepFor(param, min, max);
      return clamp(min + (Math.round((value - min) / step) * step), min, max);
    }

    function formatValue(value, unit) {
      if (typeof value === "string") return value;
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return String(value ?? "");
      const formatted = Math.abs(numeric) >= 10 ? numeric.toFixed(1) : numeric.toFixed(2);
      return unit ? `${formatted} ${unit}` : formatted;
    }

    function finiteNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function reportError(error) {
      refreshButton.disabled = false;
      setStatus(error.message);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    const snapshotElements = mountOscSnapshotPanel(document.querySelector("#snapshot-mount"), { sourceSelect: readSourceSelect });
    snapshotClient = createOscSnapshotEditorClient({ app: "poland", roleLabel: "Poland", elements: snapshotElements, instantWrite: true, serializeState: serializeSnapshotState, displayState: displaySavedState, onFocusChange: getData, liveTargetRoot: targetsEl, setStatus });
    Promise.all([refresh(), snapshotClient.init()]).catch(reportError);
  </script>
</body>
</html>
